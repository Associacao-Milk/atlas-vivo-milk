name: MILK Mistral — GitHub to Codeberg (safe sync)
run-name: Mistral Codeberg reconciliation · ${{ github.ref_name }}

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mirror-to-codeberg.yml'
      - '.github/workflows/sync-codeberg.yml'
  workflow_dispatch:

# secret-refresh-20260821d
permissions:
  contents: read
  issues: write

concurrency:
  group: milk-codeberg-master-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_USER: milkivc
      CODEBERG_REPO: atlas-vivo-milk
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect exact Codeberg target
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          remote_sha=none
          token_configured=0
          [ -n "$CODEBERG_TOKEN" ] && token_configured=1
          api_body="$RUNNER_TEMP/codeberg-repo.json"
          headers=()
          auth_user=unknown
          auth_status=missing
          [ "$token_configured" = 1 ] && headers=(-H "Authorization: token $CODEBERG_TOKEN")
          if [ "$token_configured" = 1 ]; then
            auth_status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-user.json" -w '%{http_code}' "${headers[@]}" "https://codeberg.org/api/v1/user" || true)
            if [ "$auth_status" = 200 ]; then auth_user=$(jq -r '.login // "unknown"' "$RUNNER_TEMP/codeberg-user.json"); fi
          fi
          api_status=$(curl --silent --show-error -o "$api_body" -w '%{http_code}' "${headers[@]}"             "https://codeberg.org/api/v1/repos/$CODEBERG_USER/$CODEBERG_REPO" || true)

          state=api_unreachable
          if [ "$api_status" = 404 ]; then
            if [ "$token_configured" != 1 ]; then
              state=repo_missing_or_private_auth_required
            elif [ "$auth_user" != "$CODEBERG_USER" ]; then
              state=token_account_mismatch
            else
              state=repo_missing_can_create
            fi
          elif [ "$api_status" = 200 ]; then
            credential_file="$RUNNER_TEMP/codeberg-credentials"
            if [ "$token_configured" = 1 ]; then
              git config credential.helper "store --file=$credential_file"
              printf 'protocol=https\nhost=codeberg.org\nusername=%s\npassword=%s\n\n' "$CODEBERG_USER" "$CODEBERG_TOKEN" | git credential approve
              chmod 600 "$credential_file"
            fi
            git remote add codeberg-read "https://codeberg.org/$CODEBERG_USER/$CODEBERG_REPO.git"
            if git fetch --no-tags codeberg-read master; then
              remote_sha=$(git rev-parse refs/remotes/codeberg-read/master)
              if [ "$local_sha" = "$remote_sha" ]; then
                state=equal
              elif git merge-base --is-ancestor "$remote_sha" "$local_sha"; then
                if [ "$token_configured" = 1 ]; then state=github_ahead_fast_forward; else state=github_ahead_auth_missing; fi
              elif git merge-base --is-ancestor "$local_sha" "$remote_sha"; then
                state=codeberg_ahead
              else
                state=diverged
              fi
            else
              state=repo_exists_fetch_failed
            fi
            rm -f "$credential_file"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "local_sha=$local_sha" >> "$GITHUB_OUTPUT"
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"
          echo "api_status=$api_status" >> "$GITHUB_OUTPUT"
          echo "token_configured=$token_configured" >> "$GITHUB_OUTPUT"
          echo "auth_user=$auth_user" >> "$GITHUB_OUTPUT"
          echo "auth_status=$auth_status" >> "$GITHUB_OUTPUT"

      - name: Mistral agent decides the bounded operation
        id: mistral
        shell: bash
        env:
          RECONCILE_STATE: ${{ steps.inspect.outputs.state }}
          LOCAL_SHA: ${{ steps.inspect.outputs.local_sha }}
          REMOTE_SHA: ${{ steps.inspect.outputs.remote_sha }}
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY" || { echo "::error::MISTRAL_API_KEY missing"; exit 3; }
          python - <<'PY'
          import json, os, urllib.request
          state=os.environ["RECONCILE_STATE"]
          expected={
            "equal":"NOOP_EQUAL",
            "github_ahead_fast_forward":"EXECUTE_FAST_FORWARD_SYNC",
            "repo_missing_can_create":"EXECUTE_CREATE_AND_INITIAL_SYNC",
            "github_ahead_auth_missing":"STOP_AUTH_REQUIRED",
            "repo_missing_or_private_auth_required":"STOP_AUTH_REQUIRED",
            "codeberg_ahead":"STOP_REMOTE_AHEAD",
            "diverged":"STOP_DIVERGED",
            "repo_exists_fetch_failed":"STOP_FETCH_FAILED",
            "api_unreachable":"STOP_API_UNREACHABLE",
            "token_account_mismatch":"STOP_TOKEN_ACCOUNT_MISMATCH",
          }[state]
          prompt=("You are the Mistral execution agent for Associação MILK. "
                  f"Exact target=codeberg.org/milkivc/atlas-vivo-milk; GitHub master={os.environ['LOCAL_SHA']}; "
                  f"Codeberg master={os.environ['REMOTE_SHA']}; state={state}. "
                  "Never force-push, delete refs, or rewrite history. Creating the exact missing public repository is authorized. "
                  "Only push master initially or by verified fast-forward. "
                  f"Return exactly: {expected}")
          request=urllib.request.Request(
            "https://api.mistral.ai/v1/conversations",
            data=json.dumps({"model":"mistral-small-latest","inputs":[{"role":"user","content":prompt}]}).encode(),
            method="POST",
            headers={"Authorization":"Bearer "+os.environ["MISTRAL_API_KEY"],"Content-Type":"application/json","Accept":"application/json"})
          with urllib.request.urlopen(request,timeout=120) as response:
            payload=json.loads(response.read().decode())
          answer=" ".join(str(item.get("content","")) for item in payload.get("outputs",[]) if isinstance(item,dict))
          if expected not in answer:
            raise SystemExit("Mistral decision did not match policy")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
            output.write("decision="+expected+"\n")
          PY

      - name: Create exact missing repository
        if: steps.mistral.outputs.decision == 'EXECUTE_CREATE_AND_INITIAL_SYNC'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-created.json" -w '%{http_code}'             -X POST             -H "Authorization: token $CODEBERG_TOKEN"             -H "Content-Type: application/json"             "https://codeberg.org/api/v1/user/repos"             -d '{"name":"atlas-vivo-milk","description":"Espelho operacional de milkivc/atlas-vivo-milk — Associação MILK","private":false,"auto_init":false}')
          test "$status" = 201

      - name: Execute approved non-destructive sync
        if: steps.mistral.outputs.decision == 'EXECUTE_FAST_FORWARD_SYNC' || steps.mistral.outputs.decision == 'EXECUTE_CREATE_AND_INITIAL_SYNC'
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/codeberg-credentials"
          trap 'rm -f "$credential_file"' EXIT
          git config credential.helper "store --file=$credential_file"
          printf 'protocol=https\nhost=codeberg.org\nusername=%s\npassword=%s\n\n' "$CODEBERG_USER" "$CODEBERG_TOKEN" | git credential approve
          chmod 600 "$credential_file"
          git remote add codeberg-write "https://codeberg.org/$CODEBERG_USER/$CODEBERG_REPO.git"
          if git ls-remote --exit-code --heads codeberg-write master >/dev/null 2>&1; then
            git fetch --no-tags codeberg-write master
            git merge-base --is-ancestor refs/remotes/codeberg-write/master HEAD
          fi
          git push codeberg-write HEAD:refs/heads/master
          git fetch --no-tags codeberg-write master
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/codeberg-write/master)"

      - name: Publish factual receipt
        if: always()
        shell: bash
        env:
          RECONCILE_STATE: ${{ steps.inspect.outputs.state }}
          LOCAL_SHA: ${{ steps.inspect.outputs.local_sha }}
          REMOTE_SHA: ${{ steps.inspect.outputs.remote_sha }}
          API_STATUS: ${{ steps.inspect.outputs.api_status }}
          TOKEN_CONFIGURED: ${{ steps.inspect.outputs.token_configured }}
          AUTH_USER: ${{ steps.inspect.outputs.auth_user }}
          AUTH_STATUS: ${{ steps.inspect.outputs.auth_status }}
          DECISION: ${{ steps.mistral.outputs.decision }}
        run: |
          set -euo pipefail
          body="MISTRAL_CODEBERG_RECONCILIATION state=${RECONCILE_STATE:-not_inspected} decision=${DECISION:-not_decided} api_status=${API_STATUS:-unknown} token_configured=${TOKEN_CONFIGURED:-unknown} codeberg_account=${AUTH_USER:-unknown} auth_status=${AUTH_STATUS:-unknown} github_master=${LOCAL_SHA:-unknown} codeberg_master_before=${REMOTE_SHA:-unknown} force_push=0 deleted_refs=0"
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments"             -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null

      - name: Stop when safe reconciliation is impossible
        if: startsWith(steps.mistral.outputs.decision, 'STOP_')
        run: |
          echo "::error::Codeberg was left unchanged; see issue #35."
          exit 20
