name: Preserve diálogo — Porque alguém esteve ali — Nextcloud

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/preserve-dialogo-porque-alguem-esteve-ali-nextcloud.yml'

permissions:
  contents: read

concurrency:
  group: preserve-dialogo-porque-alguem-esteve-ali-nextcloud
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Build, upload and verify dialogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import configparser
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse

          raw = os.environ.get('NEXTCLOUD_KEY', '').strip()
          base = os.environ.get('NEXTCLOUD_BASE_URL', '').strip()
          user = os.environ.get('NEXTCLOUD_USER', '').strip()
          password = os.environ.get('NEXTCLOUD_APP_PASSWORD', '').strip()
          tmp = pathlib.Path(os.environ.get('RUNNER_TEMP', '/tmp'))
          cfg = tmp / 'rclone-nextcloud.conf'
          src = tmp / 'porque-alguem-esteve-ali.md'
          readback = tmp / 'porque-alguem-esteve-ali.readback.md'

          dialogue = '''# Porque alguém esteve ali

**Uso:** diálogo público autorizado para a voz MILK no Atlas Vivo MILK.  
**Origem:** conversa de trabalho, 29 de agosto de 2026. A frase “Porque alguém esteve ali.” foi ouvida de um amigo muito querido e partilhada aqui porque encontrou outra frase: “isso é um pouquinho de mim que deixo aqui”.

---

**MILK:** Posso contar-te uma coisa que ouvi de um amigo muito querido e quis partilhar contigo?

**Pessoa:** Conta.

**MILK:** “Porque alguém esteve ali.”

**Pessoa:** Só isso?

**MILK:** Talvez seja quase tudo. Uma fotografia, uma brincadeira, uma camisa velha e surrada, uma frase torta, um canto gasto — não precisam provar nada. Às vezes são apenas um pouquinho de alguém que ficou aqui.

**Pessoa:** E o Atlas serve para guardar isso?

**MILK:** Não para guardar pessoas como coisas. Para não deixar que aquilo que elas viram, fizeram, lembraram, inventaram ou quiseram mostrar desapareça só porque ninguém tinha preparado um lugar para receber.

**Pessoa:** Então quem decide o que importa?

**MILK:** É aí que tentamos inverter o jogo. Quem costuma ser visto apenas como vulnerável pode ser curador. Pode apontar. Pode escolher. Pode dizer: olha isto.

**Pessoa:** E se eu não souber explicar?

**MILK:** Não precisas. Nós não perguntamos primeiro. Mostramos. Brincamos. Experimentamos. Deixamos um rasto. A explicação pode vir depois — ou não.

**Pessoa:** E o que querem fazer com isso?

**MILK:** Tornar um pedaço do mundo mais habitável. Nem que seja só o campo que os nossos pés conseguem ocupar. E, se alguém cruzar o caminho, abrir espaço para que também possa brincar.

**Pessoa:** Para ser a primeira palavra?

**MILK:** Nem a primeira nem a última. Talvez só aquela que alguém não esquece.

**Pessoa:** E se eu quiser deixar alguma coisa?

**MILK:** Deixa. Pode ser um pouquinho de ti.

**Pessoa:** Porquê?

**MILK:** Porque tu estiveste aqui.
'''
          src.write_text(dialogue, encoding='utf-8')

          def run(args, label, capture=True):
              p = subprocess.run(args, text=True, capture_output=capture, check=False)
              if p.returncode:
                  detail = ((p.stderr or p.stdout or '').splitlines()[-1:] or ['unknown'])[0][:300]
                  raise RuntimeError(f'{label}: {detail}')
              return p.stdout if capture else ''

          def obscure(value):
              return run(['rclone', 'obscure', value], 'RCLONE_OBSCURE_FAILED').strip()

          remote = None
          if raw.startswith('[') and re.search(r'(?im)^\s*type\s*=\s*webdav\s*$', raw):
              cfg.write_text(raw.rstrip() + '\n', encoding='utf-8')
              parser = configparser.ConfigParser()
              parser.read_string(raw)
              for section in parser.sections():
                  if parser.get(section, 'type', fallback='').strip() == 'webdav':
                      remote = section
                      break
              if not remote:
                  raise RuntimeError('NEXTCLOUD_WEBDAV_REMOTE_MISSING')
          else:
              if raw:
                  try:
                      obj = json.loads(raw)
                      if isinstance(obj, dict):
                          base = base or str(obj.get('base_url') or obj.get('url') or '')
                          user = user or str(obj.get('user') or obj.get('username') or '')
                          password = password or str(obj.get('app_password') or obj.get('password') or '')
                  except Exception:
                      pairs = {}
                      for line in raw.splitlines():
                          if '=' in line:
                              key, value = line.split('=', 1)
                              pairs[key.strip().upper()] = value.strip()
                      base = base or pairs.get('NEXTCLOUD_BASE_URL', '')
                      user = user or pairs.get('NEXTCLOUD_USER', '')
                      password = password or pairs.get('NEXTCLOUD_APP_PASSWORD', '')
                      if not base and not user and not password and '\n' not in raw:
                          password = raw
              missing = [name for name, value in (
                  ('NEXTCLOUD_BASE_URL', base),
                  ('NEXTCLOUD_USER', user),
                  ('NEXTCLOUD_APP_PASSWORD', password),
              ) if not value]
              if missing:
                  raise RuntimeError('NEXTCLOUD_CREDENTIALS_INCOMPLETE missing=' + ','.join(missing))
              if not base.startswith('https://'):
                  raise RuntimeError('NEXTCLOUD_HTTPS_REQUIRED')
              if '/remote.php/' not in base:
                  base = base.rstrip('/') + '/remote.php/dav/files/' + urllib.parse.quote(user, safe='') + '/'
              cfg.write_text(
                  '[nextcloud]\n'
                  'type = webdav\n'
                  'url = ' + base.rstrip('/') + '/\n'
                  'vendor = nextcloud\n'
                  'user = ' + user + '\n'
                  'pass = ' + obscure(password) + '\n',
                  encoding='utf-8',
              )
              remote = 'nextcloud'
          os.chmod(cfg, 0o600)

          # Existing canonical continuity area first; existing Atlas root as fallback.
          preferred_dir = 'Atlas Vivo MILK/Continuidade e Decisões/2026-08-27 — Reconstituição Chats e Saneamento Drive'
          root_dir = 'Atlas Vivo MILK'
          preferred_probe = subprocess.run(
              ['rclone', '--config', str(cfg), 'lsf', f'{remote}:{preferred_dir}', '--max-depth', '1'],
              text=True, capture_output=True, check=False,
          )
          if preferred_probe.returncode == 0:
              dest_dir = preferred_dir
          else:
              root_probe = subprocess.run(
                  ['rclone', '--config', str(cfg), 'lsf', f'{remote}:{root_dir}', '--max-depth', '1'],
                  text=True, capture_output=True, check=False,
              )
              if root_probe.returncode != 0:
                  raise RuntimeError('NEXTCLOUD_EXISTING_ATLAS_AREA_NOT_FOUND')
              dest_dir = root_dir

          filename = '2026-08-29 — Porque alguém esteve ali — diálogo sobre a essência do Atlas.md'
          destination = f'{remote}:{dest_dir}/{filename}'
          run(['rclone', '--config', str(cfg), 'copyto', str(src), destination], 'NEXTCLOUD_UPLOAD_FAILED', capture=False)
          run(['rclone', '--config', str(cfg), 'copyto', destination, str(readback)], 'NEXTCLOUD_READBACK_FAILED', capture=False)

          src_hash = hashlib.sha256(src.read_bytes()).hexdigest()
          dst_hash = hashlib.sha256(readback.read_bytes()).hexdigest()
          if src_hash != dst_hash:
              raise RuntimeError('NEXTCLOUD_SHA256_MISMATCH')

          print('NEXTCLOUD_DIALOGUE_VERIFIED')
          print('destination=' + dest_dir + '/' + filename)
          print('sha256=' + src_hash)
          print('bytes=' + str(src.stat().st_size))
          PY
