name: MILK Mistral Box Binary Capability Diagnostic
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-gmail-signed-relay-ftps.yml']
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Enumerate Box connector tools in Mistral runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request
          key=os.environ['MISTRAL_API_KEY']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          def get(path):
              q=urllib.request.Request('https://api.mistral.ai'+path,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.loads(r.read().decode())
          connectors=get('/v1/connectors')
          data=connectors.get('data',connectors if isinstance(connectors,list) else [])
          box=next((x for x in data if str(x.get('id','')).lower()=='box' or 'box' in str(x.get('name','')).lower()),None)
          if not box:
              comment('MISTRAL_BOX_DIAG failed=no_box_connector'); raise SystemExit(20)
          cid=box.get('id') or box.get('connector_id')
          tools=get(f'/v1/connectors/{cid}/tools')
          arr=tools.get('data',tools if isinstance(tools,list) else [])
          names=[]
          for t in arr:
              n=t.get('name') or t.get('function',{}).get('name') or t.get('id')
              if n:names.append(str(n))
          safe=','.join(names)
          comment(f'MISTRAL_BOX_TOOL_NAMES count={len(names)} names={safe}')
          binary=[n for n in names if any(k in n.lower() for k in ['download','content','file','shared','link','url'])]
          comment('MISTRAL_BOX_BINARY_CANDIDATES '+(','.join(binary) if binary else 'none'))
          PY
