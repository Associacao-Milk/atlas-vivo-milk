# Atlas Vivo MILK — orquestração de produção (servidor PT com domínio próprio)
# Levanta: PostgreSQL+pgvector, API Node/Express, frontend estático, nginx TLS

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milk}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_vivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milk} -d ${POSTGRES_DB:-atlas_vivo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [atlas-net]

  api:
    build: ./backend
    container_name: atlas-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - uploads:/data/uploads
      - ./secrets:/run/secrets:ro
    networks: [atlas-net]
    expose: ["3000"]

  frontend:
    build: ./frontend
    container_name: atlas-frontend
    restart: unless-stopped
    networks: [atlas-net]
    expose: ["80"]

  nginx:
    image: nginx:1.27-alpine
    container_name: atlas-nginx
    restart: unless-stopped
    depends_on: [api, frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/atlas.conf:/etc/nginx/conf.d/atlas.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-web:/var/www/certbot
    networks: [atlas-net]

volumes:
  db-data:
  uploads:
  certbot-etc:
  certbot-var:
  certbot-web:

networks:
  atlas-net:
    driver: bridge
