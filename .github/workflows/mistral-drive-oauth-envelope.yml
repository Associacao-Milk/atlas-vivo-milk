name: MILK Mistral Drive OAuth Envelope
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-drive-oauth-envelope.yml']
permissions:
  contents: read
  issues: write
jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - run: python -m pip install --quiet mistralai==2.9.3 cryptography
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from mistralai.client import Mistral
          key=os.environ["MISTRAL_API_KEY"];gh=os.environ["GH_TOKEN"];repo=os.environ["REPO"];run=os.environ["RUN_ID"]
          pub=base64.b64decode("")
          with Mistral(api_key=key) as client:
              auth=client.beta.connectors.get_auth_url(connector_id_or_name="google_drive_mcp",app_return_url="https://console.mistral.ai/")
              url=str(getattr(auth,"auth_url",""));ttl=int(getattr(auth,"ttl",0) or 0)
          if not url.startswith("https://"): raise SystemExit(29)
          aes=os.urandom(32);nonce=os.urandom(12);cipher=AESGCM(aes).encrypt(nonce,url.encode(),b"MILK-MISTRAL-DRIVE-OAUTH")
          pk=serialization.load_pem_public_key(pub)
          wrapped=pk.encrypt(aes,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          env={"v":1,"n":base64.urlsafe_b64encode(nonce).decode(),"c":base64.urlsafe_b64encode(cipher).decode(),"k":base64.urlsafe_b64encode(wrapped).decode(),"ttl":ttl}
          payload=base64.urlsafe_b64encode(json.dumps(env,separators=(",",":")).encode()).decode()
          body="MISTRAL_DRIVE_OAUTH_ENVELOPE run="+run+" payload="+payload+" url_plaintext=no drive_writes=0"
          q=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/35/comments",data=json.dumps({"body":body}).encode(),method="POST",headers={"Authorization":"Bearer "+gh,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
          urllib.request.urlopen(q,timeout=30).read()
          PY
