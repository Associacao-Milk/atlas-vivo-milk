name: MILK Mistral Gmail Connector Diagnostic
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-gmail-signed-relay-ftps.yml']
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Verify Gmail draft visibility through Mistral
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,re
          key=os.environ['MISTRAL_API_KEY']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          def get(path):
              q=urllib.request.Request('https://api.mistral.ai'+path,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.loads(r.read().decode())
          def post(path,payload):
              q=urllib.request.Request('https://api.mistral.ai'+path,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=180) as r:return json.loads(r.read().decode())
          agents=get('/v1/agents/pages'); al=agents.get('data',[]) if isinstance(agents,dict) else agents; agent=next((a for a in al if 'migra' in (str(a.get('name',''))+' '+str(a.get('description',''))).lower()),None)
          payload={'inputs':[{'role':'user','content':'Use ONLY Gmail connector. Call list_drafts. Do NOT reveal any draft body, URL, recipient or complete subject. Check whether any draft subject begins with MILKRELAY::. Return exactly FOUND=yes if one exists, otherwise FOUND=no.'}],'tools':[{'type':'connector','connector_id':'gmail'}]}
          if agent: payload['agent_id']=agent['id']
          else: payload['model']='mistral-small-latest'
          conv=post('/v1/conversations',payload)
          text=' '.join(str(x.get('content','')) for x in conv.get('outputs',[]) if isinstance(x,dict))
          found='yes' if re.search(r'FOUND\s*=\s*yes',text,re.I) else 'no'
          comment(f'MISTRAL_GMAIL_DRAFT_VISIBILITY found={found} output_types='+','.join(sorted({str(x.get('type','?')) for x in conv.get('outputs',[]) if isinstance(x,dict)}))+' drive_writes=0')
          if found!='yes': raise SystemExit(20)
          PY
