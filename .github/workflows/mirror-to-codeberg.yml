name: MILK Mistral — reconciliação preservativa Codeberg
run-name: Mistral Codeberg reconciliation · ${{ github.ref_name }}

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mirror-to-codeberg.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: milk-codeberg-main-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_USER: associacaomilk
      CODEBERG_REPO: atlas-vivo-milk
      CODEBERG_BRANCH: main
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect exact Codeberg target
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          remote_sha=none
          token_configured=0
          [ -n "$CODEBERG_TOKEN" ] && token_configured=1
          auth_user=unknown
          auth_status=missing
          headers=()
          [ "$token_configured" = 1 ] && headers=(-H "Authorization: token $CODEBERG_TOKEN")
          if [ "$token_configured" = 1 ]; then
            auth_status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-user.json" -w '%{http_code}' "${headers[@]}" "https://codeberg.org/api/v1/user" || true)
            if [ "$auth_status" = 200 ]; then auth_user=$(jq -r '.login // "unknown"' "$RUNNER_TEMP/codeberg-user.json"); fi
          fi
          api_status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-repo.json" -w '%{http_code}' "${headers[@]}" "https://codeberg.org/api/v1/repos/$CODEBERG_USER/$CODEBERG_REPO" || true)
          state=api_unreachable
          if [ "$api_status" = 404 ]; then
            if [ "$token_configured" != 1 ]; then state=repo_missing_or_private_auth_required
            elif [ "$auth_user" != "$CODEBERG_USER" ]; then state=token_account_mismatch
            else state=repo_missing_can_create; fi
          elif [ "$api_status" = 200 ]; then
            credential_file="$RUNNER_TEMP/codeberg-credentials"
            printf 'protocol=https\nhost=codeberg.org\nusername=%s\npassword=%s\n\n' "$CODEBERG_USER" "$CODEBERG_TOKEN" | git -c credential.helper="store --file=$credential_file" credential approve
            chmod 600 "$credential_file"
            git -c credential.helper="store --file=$credential_file" fetch --no-tags "https://codeberg.org/$CODEBERG_USER/$CODEBERG_REPO.git" "$CODEBERG_BRANCH:refs/remotes/codeberg/$CODEBERG_BRANCH"
            remote_sha=$(git rev-parse "refs/remotes/codeberg/$CODEBERG_BRANCH")
            rm -f "$credential_file"
            if [ "$local_sha" = "$remote_sha" ]; then state=equal
            elif git merge-base --is-ancestor "$remote_sha" "$local_sha"; then state=github_ahead_fast_forward
            elif git merge-base --is-ancestor "$local_sha" "$remote_sha"; then state=codeberg_ahead
            else state=diverged; fi
          fi
          {
            echo "state=$state"
            echo "local_sha=$local_sha"
            echo "remote_sha=$remote_sha"
            echo "api_status=$api_status"
            echo "token_configured=$token_configured"
            echo "auth_user=$auth_user"
            echo "auth_status=$auth_status"
          } >> "$GITHUB_OUTPUT"

      - name: Mistral agent decides the bounded operation
        id: mistral
        shell: bash
        env:
          RECONCILE_STATE: ${{ steps.inspect.outputs.state }}
          LOCAL_SHA: ${{ steps.inspect.outputs.local_sha }}
          REMOTE_SHA: ${{ steps.inspect.outputs.remote_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          expected={
            "equal":"NOOP_EQUAL",
            "github_ahead_fast_forward":"EXECUTE_FAST_FORWARD_SYNC",
            "repo_missing_can_create":"EXECUTE_CREATE_AND_INITIAL_SYNC",
            "diverged":"EXECUTE_PRESERVATIVE_MERGE",
            "codeberg_ahead":"STOP_REMOTE_AHEAD",
            "repo_missing_or_private_auth_required":"STOP_AUTH_REQUIRED",
            "token_account_mismatch":"STOP_TOKEN_ACCOUNT_MISMATCH",
            "api_unreachable":"STOP_API_UNREACHABLE",
          }[os.environ["RECONCILE_STATE"]]
          prompt=("You are the Mistral execution agent for Associação MILK. "
                  f"Target=codeberg.org/associacaomilk/atlas-vivo-milk main; GitHub master={os.environ['LOCAL_SHA']}; "
                  f"Codeberg main={os.environ['REMOTE_SHA']}; state={os.environ['RECONCILE_STATE']}. "
                  "Never force-push, delete refs, or rewrite history. For diverged histories, preserve the Codeberg history but retain the current GitHub working files, merge both histories, then fast-forward both remotes. "
                  f"Return exactly: {expected}")
          request=urllib.request.Request("https://api.mistral.ai/v1/conversations",
            data=json.dumps({"model":"mistral-small-latest","inputs":[{"role":"user","content":prompt}]}).encode(),
            method="POST",headers={"Authorization":"Bearer "+os.environ["MISTRAL_API_KEY"],"Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=120) as response: payload=json.loads(response.read().decode())
          answer=" ".join(str(x.get("content","")) for x in payload.get("outputs",[]) if isinstance(x,dict))
          if expected not in answer: raise SystemExit("Mistral decision did not match policy")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out: out.write("decision="+expected+"\n")
          PY

      - name: Create exact missing repository
        id: create
        if: steps.mistral.outputs.decision == 'EXECUTE_CREATE_AND_INITIAL_SYNC'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-created.json" -w '%{http_code}' -X POST -H "Authorization: token $CODEBERG_TOKEN" -H "Content-Type: application/json" "https://codeberg.org/api/v1/user/repos" -d '{"name":"atlas-vivo-milk","description":"Espelho operacional de milkivc/atlas-vivo-milk — Associação MILK","private":false,"auto_init":false}')
          test "$status" = 201
          echo "status=created" >> "$GITHUB_OUTPUT"

      - name: Execute approved non-destructive sync
        id: sync
        if: startsWith(steps.mistral.outputs.decision, 'EXECUTE_')
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/codeberg-credentials"
          trap 'rm -f "$credential_file"' EXIT
          git config credential.helper "store --file=$credential_file"
          printf 'protocol=https\nhost=codeberg.org\nusername=%s\npassword=%s\n\n' "$CODEBERG_USER" "$CODEBERG_TOKEN" | git credential approve
          chmod 600 "$credential_file"
          git remote add codeberg-write "https://codeberg.org/$CODEBERG_USER/$CODEBERG_REPO.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.mistral.outputs.decision }}" = "EXECUTE_PRESERVATIVE_MERGE" ]; then
            git fetch --no-tags codeberg-write "$CODEBERG_BRANCH"
            git merge --no-commit --no-ff --allow-unrelated-histories "refs/remotes/codeberg-write/$CODEBERG_BRANCH" || true
            test "$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ')" = "LICENSE README.md "
            git checkout --ours -- LICENSE README.md
            git add -A
            git commit -m "chore(migration): preserve Codeberg history and reconcile Atlas sources"
            git push origin HEAD:refs/heads/master
          elif [ "${{ steps.mistral.outputs.decision }}" = "EXECUTE_FAST_FORWARD_SYNC" ]; then
            git fetch --no-tags codeberg-write "$CODEBERG_BRANCH"
            git merge-base --is-ancestor "refs/remotes/codeberg-write/$CODEBERG_BRANCH" HEAD
          fi
          git push codeberg-write HEAD:refs/heads/$CODEBERG_BRANCH
          git fetch --no-tags codeberg-write "$CODEBERG_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/codeberg-write/$CODEBERG_BRANCH)"
          echo "status=completed" >> "$GITHUB_OUTPUT"

      - name: Publish factual receipt
        if: always()
        shell: bash
        env:
          RECONCILE_STATE: ${{ steps.inspect.outputs.state }}
          LOCAL_SHA: ${{ steps.inspect.outputs.local_sha }}
          REMOTE_SHA: ${{ steps.inspect.outputs.remote_sha }}
          API_STATUS: ${{ steps.inspect.outputs.api_status }}
          TOKEN_CONFIGURED: ${{ steps.inspect.outputs.token_configured }}
          AUTH_USER: ${{ steps.inspect.outputs.auth_user }}
          AUTH_STATUS: ${{ steps.inspect.outputs.auth_status }}
          DECISION: ${{ steps.mistral.outputs.decision }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
        run: |
          set -euo pipefail
          body="MISTRAL_CODEBERG_RECONCILIATION state=${RECONCILE_STATE:-not_inspected} decision=${DECISION:-not_decided} sync=${SYNC_STATUS:-not_completed} api_status=${API_STATUS:-unknown} token_configured=${TOKEN_CONFIGURED:-unknown} codeberg_account=${AUTH_USER:-unknown} auth_status=${AUTH_STATUS:-unknown} github_master=${LOCAL_SHA:-unknown} codeberg_main_before=${REMOTE_SHA:-unknown} force_push=0 deleted_refs=0"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null

      - name: Stop when safe reconciliation is impossible
        if: startsWith(steps.mistral.outputs.decision, 'STOP_')
        run: exit 20


  mistral_hygiene_audit:
    needs: reconcile
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify mirrored public tree
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          credential_file="$RUNNER_TEMP/codeberg-credentials"
          trap 'rm -f "$credential_file"' EXIT
          printf 'protocol=https\nhost=codeberg.org\nusername=associacaomilk\npassword=%s\n\n' "$CODEBERG_TOKEN" | git -c credential.helper="store --file=$credential_file" credential approve
          git -c credential.helper="store --file=$credential_file" fetch --no-tags https://codeberg.org/associacaomilk/atlas-vivo-milk.git main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git ls-tree -r --name-only HEAD | LC_ALL=C sort > "$RUNNER_TEMP/atlas-paths.txt"

      - name: Mistral classifies public hygiene
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          paths=pathlib.Path(os.environ["RUNNER_TEMP"],"atlas-paths.txt").read_text(encoding="utf-8").splitlines()
          prompt=(
            "You are the Mistral hygiene agent for Associação MILK. Audit only this public repository path inventory. "
            "Do not infer file contents. Identify public-surface clutter, duplicate automation, or files that could expose internal implementation by name. "
            "Preserve evidence and history: propose no deletion and no rewrite. "
            "Return concise PT-PT Markdown with exactly: RESULTADO, MANTER_PUBLICO, REVER_ANTES_DE_PUBLICAR, "
            "CANDIDATOS_A_ARQUIVO_NA_RAMA_DE_HISTORICO, and a SAFE_NEXT_ACTION. "
            "Classify only by paths; uncertain paths go to REVER.\n\nPATHS:\n" + "\n".join(paths)
          )
          request=urllib.request.Request(
            "https://api.mistral.ai/v1/conversations",
            data=json.dumps({"model":"mistral-small-latest","inputs":[{"role":"user","content":prompt}]}).encode(),
            method="POST",
            headers={"Authorization":"Bearer "+os.environ["MISTRAL_API_KEY"],"Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=120) as response:
            payload=json.loads(response.read().decode())
          answer="\n".join(str(x.get("content","")) for x in payload.get("outputs",[]) if isinstance(x,dict)).strip()
          if not answer: raise SystemExit("Mistral audit returned no content")
          pathlib.Path(os.environ["RUNNER_TEMP"],"mistral-hygiene.md").write_text(answer,encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
            out.write("report<<EOF\n"+answer+"\nEOF\n")
          PY

      - name: Publish Mistral hygiene receipt
        if: always()
        shell: bash
        env:
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          set -euo pipefail
          body="MISTRAL_CODEBERG_HYGIENE_AUDIT\n\n${REPORT:-Audit not completed.}"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null


  mistral_public_hygiene:
    needs: [reconcile, mistral_hygiene_audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      ARCHIVE_BRANCH: historico/pre-saneamento-publico-20260821
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mistral authorizes bounded public-tree cleanup
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          candidates=[
            "ATIVAR_TUDO_AGORA.html","ATLAS_CONSOLE_WEB.html","ATLAS_LINK.html","CLIQUE_AQUI.html","INDEX.html",
            "ONE_CLICK_DEPLOY.sh","ONE_CLICK_README.md","ONE_CLICK_REAL.sh",
            "ops/archive","ops/.mistral-trigger-20260820-2149.txt","ops/canary-trigger-20260821-0247.txt"
          ]
          present=[p for p in candidates if pathlib.Path(p).exists()]
          expected="EXECUTE_ARCHIVE_BRANCH_AND_CLEAN_PUBLIC_TREE" if present else "NOOP_PUBLIC_TREE_CLEAN"
          prompt=(
            "You are the Mistral execution agent for Associação MILK. "
            "Only act on this exact audited clutter list, never integration files, data, credentials, or active workflows. "
            "Before removal from the public default branch, create a non-destructive historical branch at the current commit. "
            "No force-push, no deletion of branches, no rewrite. "
            f"Candidates present: {present}. Return exactly: {expected}"
          )
          request=urllib.request.Request("https://api.mistral.ai/v1/conversations",
            data=json.dumps({"model":"mistral-small-latest","inputs":[{"role":"user","content":prompt}]}).encode(),
            method="POST",headers={"Authorization":"Bearer "+os.environ["MISTRAL_API_KEY"],"Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=120) as response: payload=json.loads(response.read().decode())
          answer=" ".join(str(x.get("content","")) for x in payload.get("outputs",[]) if isinstance(x,dict))
          if expected not in answer: raise SystemExit("Mistral decision did not match bounded policy")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out: out.write("value="+expected+"\n")
          PY

      - name: Execute Mistral-approved public-tree cleanup
        id: clean
        if: steps.decision.outputs.value == 'EXECUTE_ARCHIVE_BRANCH_AND_CLEAN_PUBLIC_TREE'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          credential_file="$RUNNER_TEMP/codeberg-credentials"
          trap 'rm -f "$credential_file"' EXIT
          git config credential.helper "store --file=$credential_file"
          printf 'protocol=https\nhost=codeberg.org\nusername=associacaomilk\npassword=%s\n\n' "$CODEBERG_TOKEN" | git credential approve
          chmod 600 "$credential_file"
          git remote add codeberg-write https://codeberg.org/associacaomilk/atlas-vivo-milk.git
          if ! git ls-remote --exit-code origin "refs/heads/$ARCHIVE_BRANCH" >/dev/null 2>&1; then
            git push origin HEAD:refs/heads/$ARCHIVE_BRANCH
          fi
          if ! git ls-remote --exit-code codeberg-write "refs/heads/$ARCHIVE_BRANCH" >/dev/null 2>&1; then
            git push codeberg-write HEAD:refs/heads/$ARCHIVE_BRANCH
          fi
          git rm -r --ignore-unmatch -- ATIVAR_TUDO_AGORA.html ATLAS_CONSOLE_WEB.html ATLAS_LINK.html CLIQUE_AQUI.html INDEX.html ONE_CLICK_DEPLOY.sh ONE_CLICK_README.md ONE_CLICK_REAL.sh ops/archive ops/.mistral-trigger-20260820-2149.txt ops/canary-trigger-20260821-0247.txt
          test -n "$(git status --porcelain)"
          git commit -m "chore(public): remove audited clutter from default tree"
          git push origin HEAD:refs/heads/master
          git push codeberg-write HEAD:refs/heads/main
          git fetch --no-tags codeberg-write main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/codeberg-write/main)"
          echo "status=completed" >> "$GITHUB_OUTPUT"

      - name: Publish factual cleanup receipt
        if: always()
        shell: bash
        env:
          DECISION: ${{ steps.decision.outputs.value }}
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
        run: |
          set -euo pipefail
          body="MISTRAL_CODEBERG_PUBLIC_HYGIENE decision=${DECISION:-not_decided} cleanup=${CLEAN_STATUS:-not_completed} archive_branch=$ARCHIVE_BRANCH force_push=0 deleted_refs=0 protected_paths=integration_orcid_zenodo_active_workflows"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null


  mistral_interoperability_audit:
    needs: [reconcile, mistral_public_hygiene]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
      ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather non-destructive interoperability evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          zenodo_status=not_configured
          if [ -n "$ZENODO_TOKEN" ]; then
            zenodo_status=$(curl --silent --show-error -o "$RUNNER_TEMP/zenodo.json" -w '%{http_code}' -H "Authorization: Bearer $ZENODO_TOKEN" "https://zenodo.org/api/deposit/depositions?size=1" || true)
          fi
          {
            echo "zenodo_status=$zenodo_status"
            echo "orcid_credentials=$([ -n "$ORCID_CLIENT_ID" ] && [ -n "$ORCID_CLIENT_SECRET" ] && echo configured || echo incomplete)"
            echo "citation_cff=$([ -f CITATION.cff ] && echo present || echo absent)"
            echo "zenodo_metadata=$([ -f .zenodo.json ] && echo present || echo absent)"
            echo "codemeta=$([ -f codemeta.json ] && echo present || echo absent)"
            echo "license=$([ -f LICENSE ] && echo present || echo absent)"
            echo "governance=$([ -f GOVERNANCE.md ] && echo present || echo absent)"
            echo "security=$([ -f SECURITY.md ] && echo present || echo absent)"
          } >> "$GITHUB_OUTPUT"
          curl --silent --show-error -o "$RUNNER_TEMP/forgejo-version.json" https://codeberg.org/api/v1/version || true

      - name: Mistral evaluates platform readiness
        id: audit
        shell: bash
        env:
          ZENODO_STATUS: ${{ steps.evidence.outputs.zenodo_status }}
          ORCID_CREDENTIALS: ${{ steps.evidence.outputs.orcid_credentials }}
          CITATION_CFF: ${{ steps.evidence.outputs.citation_cff }}
          ZENODO_METADATA: ${{ steps.evidence.outputs.zenodo_metadata }}
          CODEMETA: ${{ steps.evidence.outputs.codemeta }}
          LICENSE_FILE: ${{ steps.evidence.outputs.license }}
          GOVERNANCE_FILE: ${{ steps.evidence.outputs.governance }}
          SECURITY_FILE: ${{ steps.evidence.outputs.security }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          evidence={k:os.environ[k] for k in ["ZENODO_STATUS","ORCID_CREDENTIALS","CITATION_CFF","ZENODO_METADATA","CODEMETA","LICENSE_FILE","GOVERNANCE_FILE","SECURITY_FILE"]}
          prompt=(
            "You are the Mistral interoperability agent for Associação MILK. "
            "Using only this non-destructive evidence, produce concise PT-PT Markdown under: "
            "CODEBERG_FORGEJO, ZENODO, ORCID, METADADOS, BLOQUEIOS_REAIS, and NEXT_SAFE_EXECUTIONS. "
            "Never claim a DOI, ORCID work, release, credential scope, or deposit exists unless evidence proves it. "
            "Do not include secrets or request their values. Evidence: " + json.dumps(evidence,ensure_ascii=False)
          )
          request=urllib.request.Request("https://api.mistral.ai/v1/conversations",
            data=json.dumps({"model":"mistral-small-latest","inputs":[{"role":"user","content":prompt}]}).encode(),
            method="POST",headers={"Authorization":"Bearer "+os.environ["MISTRAL_API_KEY"],"Content-Type":"application/json"})
          with urllib.request.urlopen(request,timeout=120) as response: payload=json.loads(response.read().decode())
          answer="\n".join(str(x.get("content","")) for x in payload.get("outputs",[]) if isinstance(x,dict)).strip()
          if not answer: raise SystemExit("Mistral interoperability audit returned no content")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out: out.write("report<<EOF\n"+answer+"\nEOF\n")
          PY

      - name: Publish Mistral interoperability receipt
        if: always()
        shell: bash
        env:
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          set -euo pipefail
          body="MISTRAL_INTEROPERABILITY_AUDIT\n\n${REPORT:-Audit not completed.}"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
