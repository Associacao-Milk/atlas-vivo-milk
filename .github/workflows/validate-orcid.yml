name: Validate ORCIDs

on:
  push:
    paths:
      - '**.json'
      - '**.md'
      - '**.yml'
      - '**.yaml'
  pull_request:
    paths:
      - '**.json'
      - '**.md'
      - '**.yml'
      - '**.yaml'

jobs:
  validate-orcids:
    name: Validate ORCIDs in repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Validate ORCIDs
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function validateORCID(orcid, filePath) {
              const normalized = orcid.replace(/-/g, '').toLowerCase();
              if (!/^[0-9]{16}$/.test(normalized)) {
                console.error('❌ ORCID inválido:', orcid, 'em', filePath);
                return false;
              }
              console.log('✅ ORCID válido:', orcid, 'em', filePath);
              return true;
            }
            function scanFiles(dir, fileList = []) {
              const files = fs.readdirSync(dir);
              files.forEach(file => {
                const filePath = path.join(dir, file);
                if (fs.statSync(filePath).isDirectory()) scanFiles(filePath, fileList);
                else if (filePath.endsWith('.json') || filePath.endsWith('.md') || filePath.endsWith('.yml') || filePath.endsWith('.yaml')) fileList.push(filePath);
              });
              return fileList;
            }
            const allFiles = scanFiles('.');
            let allValid = true;
            let orcidCount = 0;
            allFiles.forEach(filePath => {
              try {
                const content = fs.readFileSync(filePath, 'utf8');
                const orcidMatches = content.match(/000[0-9]{3}-000[0-9]{3}-[0-9]{3}[0-9X]/g) || [];
                orcidMatches.forEach(orcid => { orcidCount++; if (!validateORCID(orcid, filePath)) allValid = false; });
              } catch (err) { console.error('⚠️ Erro ao ler arquivo:', filePath, err.message); }
            });
            console.log('📊 Total de ORCIDs encontrados:', orcidCount);
            console.log('📁 Arquivos verificados:', allFiles.length);
            if (!allValid) process.exit(1);
          "

      - name: Check canonical metadata for placeholder ORCIDs
        run: |
          placeholder="$(printf '%s' '0000-0000-0000-0000')"
          files=()
          for file in metadata.json .zenodo.json CITATION.cff; do
            [ ! -f "$file" ] || files+=("$file")
          done
          if [ "${#files[@]}" -gt 0 ] && grep -nF "$placeholder" "${files[@]}"; then
            echo "ORCID placeholder encontrado em metadados canónicos"
            exit 1
          fi
          echo "Nenhum ORCID placeholder nos metadados canónicos"

      - name: Check for missing ORCIDs in metadata
        run: |
          if [ -f "metadata.json" ]; then
            orcid_nuno=$(jq -r '.creators[] | select(.name | contains("Nuno")) | .orcid' metadata.json 2>/dev/null || echo "")
            orcid_eduardo=$(jq -r '.creators[] | select(.name | contains("Eduardo")) | .orcid' metadata.json 2>/dev/null || echo "")
            if [ "$orcid_nuno" != "0009-0009-1781-4020" ]; then echo "❌ ORCID do Nuno está incorreto em metadata.json: $orcid_nuno"; exit 1; fi
            if [ "$orcid_eduardo" != "0009-0007-6892-6570" ]; then echo "❌ ORCID do Eduardo está incorreto em metadata.json: $orcid_eduardo"; exit 1; fi
            echo "✅ ORCIDs em metadata.json estão corretos"
          fi

  sync-nextcloud-public-work:
    name: Sync private Atlas public Web App work to Nextcloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
    steps:
      - name: Checkout public Web App work branch
        uses: actions/checkout@v4
        with:
          ref: work/public-experience-architecture-20260829

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Copy Web App work to private Nextcloud and verify
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import configparser,io,json,os,pathlib,re,subprocess,urllib.parse
          root=pathlib.Path('deploy/atlas-public')
          if not root.is_dir(): raise RuntimeError('ATLAS_PUBLIC_SOURCE_MISSING')
          raw=os.environ.get('NEXTCLOUD_KEY','').strip(); base=os.environ.get('NEXTCLOUD_BASE_URL','').strip(); user=os.environ.get('NEXTCLOUD_USER','').strip(); password=os.environ.get('NEXTCLOUD_APP_PASSWORD','').strip(); tmp=pathlib.Path(os.environ.get('RUNNER_TEMP','/tmp')); cfg=tmp/'nextcloud-rclone.conf'
          def run(args,label,capture=True):
              p=subprocess.run(args,text=True,capture_output=capture,check=False)
              if p.returncode:
                  detail=((p.stderr or p.stdout or '').splitlines()[-1:] or ['unknown'])[0][:300]
                  raise RuntimeError(label+' detail='+detail)
              return p.stdout if capture else ''
          def obscure(v): return run(['rclone','obscure',v],'RCLONE_OBSCURE_FAILED').strip()
          remote=None
          if raw.startswith('[') and re.search(r'(?im)^\s*type\s*=\s*webdav\s*$',raw):
              parser=configparser.ConfigParser(interpolation=None); parser.read_string(raw)
              for section in parser.sections():
                  if parser.get(section,'type',fallback='').strip()=='webdav':
                      remote=section
                      secret_user=parser.get(section,'user',fallback='').strip()
                      if not secret_user: raise RuntimeError('NEXTCLOUD_USER_MISSING_IN_REMOTE')
                      parser.set(section,'url','https://associacaomilk.pt/nextcloud/remote.php/dav/files/'+urllib.parse.quote(secret_user,safe='')+'/')
                      parser.set(section,'vendor','nextcloud')
                      break
              if not remote: raise RuntimeError('NEXTCLOUD_WEBDAV_REMOTE_MISSING')
              with cfg.open('w',encoding='utf-8') as fh: parser.write(fh)
          else:
              if raw:
                  try:
                      obj=json.loads(raw)
                      if isinstance(obj,dict):
                          base=base or str(obj.get('base_url') or obj.get('url') or ''); user=user or str(obj.get('user') or obj.get('username') or ''); password=password or str(obj.get('app_password') or obj.get('password') or '')
                  except Exception:
                      pairs={}
                      for line in raw.splitlines():
                          if '=' in line:
                              k,v=line.split('=',1); pairs[k.strip().upper()]=v.strip()
                      base=base or pairs.get('NEXTCLOUD_BASE_URL',''); user=user or pairs.get('NEXTCLOUD_USER',''); password=password or pairs.get('NEXTCLOUD_APP_PASSWORD','')
                      if not base and not user and not password and '\n' not in raw: password=raw
              base='https://associacaomilk.pt/nextcloud'; user=user or 'admin'
              if not password: raise RuntimeError('NEXTCLOUD_CREDENTIALS_INCOMPLETE')
              base=base.rstrip('/')+'/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/'
              cfg.write_text('[nextcloud]\ntype = webdav\nurl = '+base+'\nvendor = nextcloud\nuser = '+user+'\npass = '+obscure(password)+'\n',encoding='utf-8'); remote='nextcloud'
          os.chmod(cfg,0o600)
          run(['rclone','--config',str(cfg),'lsd',remote+':'],'NEXTCLOUD_WEBDAV_PROBE_FAILED')
          dest='NEXTCLOUD_ATLAS/CAMADA_PUBLICA_WEBAPP_WORK'
          run(['rclone','--config',str(cfg),'mkdir',f'{remote}:{dest}'],'NEXTCLOUD_TARGET_PREPARE_FAILED')
          run(['rclone','--config',str(cfg),'copy',str(root),f'{remote}:{dest}','--create-empty-src-dirs'],'NEXTCLOUD_UPLOAD_FAILED',capture=False)
          run(['rclone','--config',str(cfg),'check',str(root),f'{remote}:{dest}','--download','--one-way'],'NEXTCLOUD_READBACK_VERIFY_FAILED',capture=False)
          files=[p for p in root.rglob('*') if p.is_file()]; total_bytes=sum(p.stat().st_size for p in files)
          print('NEXTCLOUD_ATLAS_PUBLIC_WORK_VERIFIED')
          print('destination='+dest)
          print('files='+str(len(files)))
          print('bytes='+str(total_bytes))
          print('source_writes=0')
          print('remote_deletes=0')
          PY
