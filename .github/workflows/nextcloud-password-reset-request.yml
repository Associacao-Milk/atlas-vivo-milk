name: Nextcloud admin password reset request

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/nextcloud-password-reset-request.yml'

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request one native Nextcloud password reset for admin
        shell: bash
        run: |
          set -euo pipefail
          base='https://associacaomilk.pt/nextcloud/index.php'
          jar="$RUNNER_TEMP/nextcloud.cookies"

          curl --fail --silent --show-error --location --max-time 30 \
            -c "$jar" -b "$jar" \
            "$base/login" -o "$RUNNER_TEMP/nextcloud-login.html"

          token_json="$(curl --fail --silent --show-error --location --max-time 30 \
            -c "$jar" -b "$jar" \
            -H 'Accept: application/json' \
            "$base/csrftoken")"
          request_token="$(printf '%s' "$token_json" | python -c 'import json,sys; v=json.load(sys.stdin).get("token",""); assert v; print(v)')"

          response="$(curl --silent --show-error --location --max-time 30 \
            -c "$jar" -b "$jar" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H "requesttoken: $request_token" \
            --data-urlencode 'user=admin' \
            -w '\nHTTP_STATUS=%{http_code}' \
            "$base/lostpassword/email")"
          unset request_token token_json

          status="$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS=//p' | tail -n1)"
          body="$(printf '%s\n' "$response" | sed '/^HTTP_STATUS=/d')"
          if [ "$status" != '200' ]; then
            printf 'NEXTCLOUD_RESET_REQUEST_FAILED http=%s body=%s\n' "$status" "$(printf '%s' "$body" | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
          printf '%s' "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="success", d; print("NEXTCLOUD_RESET_REQUEST_ACCEPTED user=admin")'
