name: MILK diagnose Nextcloud credential shape

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diagnose-nextcloud-secret-shape.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
    steps:
      - name: Report shape only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import configparser,json,os,re,urllib.parse
          raw=os.environ.get('NEXTCLOUD_KEY','').strip()
          base=os.environ.get('NEXTCLOUD_BASE_URL','').strip()
          user=os.environ.get('NEXTCLOUD_USER','').strip()
          app=os.environ.get('NEXTCLOUD_APP_PASSWORD','').strip()
          fmt='missing'; parsed_base=''; parsed_user=''
          if raw:
              if raw.startswith('[') and re.search(r'(?im)^\s*type\s*=\s*webdav\s*$',raw):
                  fmt='rclone_webdav_config'
                  p=configparser.ConfigParser(); p.read_string(raw)
                  for s in p.sections():
                      if p.get(s,'type',fallback='').strip()=='webdav':
                          parsed_base=p.get(s,'url',fallback='').strip(); parsed_user=p.get(s,'user',fallback='').strip(); break
              else:
                  try:
                      obj=json.loads(raw)
                      if isinstance(obj,dict):
                          fmt='json_object'; parsed_base=str(obj.get('base_url') or obj.get('url') or ''); parsed_user=str(obj.get('user') or obj.get('username') or '')
                  except Exception:
                      if '=' in raw and '\n' in raw:
                          fmt='key_value_block'
                          pairs={}
                          for line in raw.splitlines():
                              if '=' in line:
                                  k,v=line.split('=',1); pairs[k.strip().upper()]=v.strip()
                          parsed_base=pairs.get('NEXTCLOUD_BASE_URL',''); parsed_user=pairs.get('NEXTCLOUD_USER','')
                      else:
                          fmt='opaque_single_value'
          effective_base=base or parsed_base
          effective_user=user or parsed_user
          host=''
          path=''
          if effective_base:
              try:
                  u=urllib.parse.urlsplit(effective_base); host=u.hostname or ''; path=u.path or '/'
              except Exception: pass
          print('NEXTCLOUD_DIAGNOSTIC')
          print('key_format='+fmt)
          print('explicit_base_present='+('yes' if base else 'no'))
          print('explicit_user_present='+('yes' if user else 'no'))
          print('explicit_app_password_present='+('yes' if app else 'no'))
          print('effective_host='+(host or 'unknown'))
          print('effective_path='+(path or 'unknown'))
          print('effective_user='+(effective_user or 'unknown'))
          print('secret_values_disclosed=0')
          PY
