name: Preserve Atlas dialogue to Nextcloud

on:
  push:
    branches:
      - master
    paths:
      - docs/dialogos/2026-08-29-porque-alguem-esteve-ali.md
      - .github/workflows/preserve-dialogo-porque-alguem-esteve-ali-nextcloud.yml

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Upload and verify
        shell: bash
        run: |
          set -euo pipefail

          SRC='docs/dialogos/2026-08-29-porque-alguem-esteve-ali.md'
          BASE="${NEXTCLOUD_BASE_URL:-https://associacaomilk.pt/nextcloud}"
          USER="${NEXTCLOUD_USER:-admin}"
          PASS="${NEXTCLOUD_APP_PASSWORD:-${NEXTCLOUD_KEY:-}}"

          if [ -z "$PASS" ]; then
            echo 'BLOCKED: NEXTCLOUD credential secret is missing'
            exit 2
          fi

          if [[ "$BASE" == *'/remote.php/'* ]]; then
            DAV="$BASE"
          else
            DAV="${BASE%/}/remote.php/dav/files/${USER}/"
          fi

          rclone config create milk-nextcloud webdav \
            url "$DAV" \
            vendor nextcloud \
            user "$USER" \
            pass "$(rclone obscure "$PASS")" >/dev/null

          if rclone lsf 'milk-nextcloud:Atlas Vivo MILK/Continuidade e Decisões/2026-08-27 — Reconstituição Chats e Saneamento Drive' --max-depth 1 >/dev/null 2>&1; then
            DESTDIR='Atlas Vivo MILK/Continuidade e Decisões/2026-08-27 — Reconstituição Chats e Saneamento Drive'
          elif rclone lsf 'milk-nextcloud:Atlas Vivo MILK' --max-depth 1 >/dev/null 2>&1; then
            DESTDIR='Atlas Vivo MILK'
          else
            echo 'BLOCKED: existing Atlas Vivo MILK area was not found or WebDAV authentication failed'
            exit 3
          fi

          DEST="milk-nextcloud:${DESTDIR}/2026-08-29 — Porque alguém esteve ali — diálogo sobre a essência do Atlas.md"
          rclone copyto "$SRC" "$DEST"
          rclone copyto "$DEST" "$RUNNER_TEMP/readback.md"

          SRC_HASH="$(sha256sum "$SRC" | awk '{print $1}')"
          DST_HASH="$(sha256sum "$RUNNER_TEMP/readback.md" | awk '{print $1}')"
          test "$SRC_HASH" = "$DST_HASH"

          echo 'NEXTCLOUD_DIALOGUE_VERIFIED'
          echo "destination=${DEST#milk-nextcloud:}"
          echo "sha256=$SRC_HASH"
          echo "bytes=$(wc -c < "$SRC" | tr -d ' ')"
