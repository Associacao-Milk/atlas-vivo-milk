name: Mistral audit — Atlas 7 dynamics
on:
  pull_request:
    paths: ["deploy/atlas-public/**"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic package gate
        working-directory: deploy/atlas-public
        run: |
          set -euo pipefail
          sha256sum -c manifest.sha256
          node --check app.js
          for motor in "Inventário do Meu Mundo" "Catástrofe Produtiva" "O Ponto de Kusama" "O Corpo que Percebe" "Escutar o Silêncio" "O Rizoma Interior" "O Cubo Interior"; do grep -Fq "$motor" app.js; done
          ! grep -RIE '(password|api[_-]?key|private[_-]?key|authorization:[[:space:]]*(bearer|token))' index.html styles.css app.js
      - name: Mistral semantic and safety audit
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json,os,pathlib,urllib.request
          root=pathlib.Path('deploy/atlas-public')
          source='\n\n'.join((root/n).read_text(encoding='utf-8') for n in ('index.html','app.js'))
          prompt='''Audita este frontend do Atlas Vivo MILK. Responde exclusivamente JSON com as chaves approved (boolean), seven_engines (boolean), no_remote_collection (boolean), human_sovereignty (boolean), findings (array). Reprova se faltar algum dos sete motores, se houver envio remoto de contribuições, exposição real de camada invisível, vigilância, promessa clínica ou decisão curatorial automática. Não registes a ausência de um problema como finding e nunca atribuas severidade a uma conclusão que afirme que o problema não existe. approved deve ser exactamente a conjunção dos outros três booleanos quando não houver violação real.''' + source
          req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps({'model':'mistral-small-latest','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'user','content':prompt}]}).encode(),headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r: result=json.loads(json.loads(r.read())['choices'][0]['message']['content'])
          print(json.dumps(result,ensure_ascii=False))
          assert result.get('approved') and result.get('seven_engines') and result.get('no_remote_collection') and result.get('human_sovereignty'),result
          PY
