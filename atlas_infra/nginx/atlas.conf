# Atlas Vivo MILK — vhost para o domínio PT
# Substituir ${ATLAS_DOMAIN} pelo domínio real (ex.: atlas.milk.pt).
# Após obter TLS, descomentar o bloco 443 e o redirect.

#map $http_upgrade $connection_upgrade {
#  default upgrade;
#  ''      close;
#}

# --- HTTP: redirect para HTTPS + endpoint Certbot ---
server {
  listen 80;
  server_name atlas.milk.pt;

  # Desafio ACME para Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect permanente para HTTPS (ativar depois de obter o certificado)
  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS: frontend + proxy API ---
server {
  listen 443 ssl http2;
  server_name atlas.milk.pt;

  # Caminhos Let's Encrypt (preencher após certbot)
  ssl_certificate     /etc/letsencrypt/live/atlas.milk.pt/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/atlas.milk.pt/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;

  # CSP — anti-scraping (Bloco 7.1): só fontes explícitas
  add_header Content-Security-Policy
    "default-src 'self'; \
     script-src 'self' https://unpkg.com; \
     style-src 'self' https://unpkg.com https://fonts.googleapis.com 'unsafe-inline'; \
     img-src 'self' https: data: blob:; \
     media-src 'self' blob:; \
     connect-src 'self' https://snig.dgterritorio.gov.pt https://geoapi.pt; \
     font-src 'self' https://fonts.gstatic.com; \
     frame-ancestors 'none'; \
     base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Frontend estático
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # API — rate limited
  location /api/ {
    limit_req zone=atlas_api burst=20 nodelay;
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # Submissão de histórias (upload maior)
  location /submit-historia {
    limit_req zone=atlas_api burst=5 nodelay;
    client_max_body_size 520m;
    proxy_pass http://api:3000/submit-historia;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }

  # Health check (interno)
  location = /healthz {
    proxy_pass http://api:3000/api/health;
    access_log off;
  }
}
