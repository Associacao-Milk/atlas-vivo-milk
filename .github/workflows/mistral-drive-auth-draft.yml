name: MILK Mistral Drive OAuth Draft
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-drive-auth-draft.yml']
permissions:
  contents: read
  issues: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - run: python -m pip install --quiet mistralai==2.9.3
      - name: Generate private OAuth URL and create Gmail draft through Mistral
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from mistralai.client import Mistral
          key=os.environ["MISTRAL_API_KEY"]; gh=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]
          def comment(msg):
              q=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/35/comments",data=json.dumps({"body":msg}).encode(),method="POST",headers={"Authorization":"Bearer "+gh,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
              urllib.request.urlopen(q,timeout=30).read()
          with Mistral(api_key=key) as client:
              auth=client.beta.connectors.get_auth_url(
                  connector_id_or_name="google_drive_mcp",
                  app_return_url="https://console.mistral.ai/"
              )
              auth_url=str(getattr(auth,"auth_url",""))
              ttl=getattr(auth,"ttl",None)
              if not auth_url.startswith("https://"):
                  comment("MISTRAL_DRIVE_OAUTH_DRAFT_FAILED stage=auth_url drive_writes=0")
                  raise SystemExit(25)
          prompt=("Create a Gmail draft only; do not send it. Recipient: somostodospossiveis@gmail.com. "
                  "Subject: MILK — Autorizar Google Drive MCP. "
                  "Plain-text body: Clique no link abaixo para autorizar o conector Google Drive MCP do agente Mistral. "
                  "Depois de concluir o OAuth, volte ao Atlas. Link: "+auth_url)
          payload={"model":"mistral-small-latest","inputs":[{"role":"user","content":prompt}],
                   "tools":[{"type":"connector","connector_id":"gmail","tool_configuration":{"include":["create_draft"]}}]}
          q=urllib.request.Request("https://api.mistral.ai/v1/conversations",data=json.dumps(payload).encode(),method="POST",headers={"Authorization":"Bearer "+key,"Content-Type":"application/json","Accept":"application/json"})
          try:
              with urllib.request.urlopen(q,timeout=180) as r: conv=json.loads(r.read().decode())
              out=" ".join(str(x.get("content","")) for x in conv.get("outputs",[]) if isinstance(x,dict))
              low=out.lower()
              if any(x in low for x in ("draft","rascunho","created","criado")):
                  comment("MISTRAL_DRIVE_OAUTH_DRAFT_CREATED mailbox=self subject=MILK_Autorizar_Google_Drive_MCP ttl="+str(ttl)+" url_disclosed=no drive_writes=0")
              else:
                  comment("MISTRAL_DRIVE_OAUTH_DRAFT_PENDING confirmation_or_connector_action_required url_disclosed=no drive_writes=0")
                  raise SystemExit(26)
          except Exception:
              comment("MISTRAL_DRIVE_OAUTH_DRAFT_FAILED stage=gmail_create_draft url_disclosed=no drive_writes=0")
              raise
          PY
