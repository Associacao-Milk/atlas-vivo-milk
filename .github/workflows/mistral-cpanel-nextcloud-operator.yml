name: MILK Mistral cPanel Nextcloud operator

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'agents/milk-cpanel-nextcloud-operator.md'
      - '.github/workflows/mistral-cpanel-nextcloud-operator.yml'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: milk-mistral-cpanel-nextcloud-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      PTSERVIDOR_CPANEL_TOKEN: ${{ secrets.PTSERVIDOR_CPANEL_TOKEN }}
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      NEXTCLOUD_DATA_OUTSIDE_WEBROOT_CONFIRMED: ${{ secrets.NEXTCLOUD_DATA_OUTSIDE_WEBROOT_CONFIRMED }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Mistral SDK
        run: python -m pip install --quiet 'mistralai>=1.9,<2'

      - name: Provision Mistral operator and execute cPanel preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          from mistralai import Mistral

          MISTRAL = os.environ.get("MISTRAL_API_KEY", "").strip()
          CPANEL_TOKEN = (
              os.environ.get("CPANEL_API_TOKEN", "").strip()
              or os.environ.get("CPANEL_TOKEN", "").strip()
              or os.environ.get("PTSERVIDOR_CPANEL_TOKEN", "").strip()
          )
          GH = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          RUN_ID = os.environ["RUN_ID"]
          USER = "associ16"
          HOST = "troi.ptservidor.net"
          DOMAIN = "nuvem.associacaomilk.pt"
          ROOT_DOMAIN = "associacaomilk.pt"
          DOCROOT = "nuvem.associacaomilk.pt"
          SPEC_PATH = pathlib.Path("agents/milk-cpanel-nextcloud-operator.md")
          SPEC = SPEC_PATH.read_text(encoding="utf-8")
          SPEC_SHA = hashlib.sha256(SPEC.encode()).hexdigest()

          def comment(message):
              print(message, flush=True)
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/issues/35/comments",
                  data=json.dumps({"body": message}).encode(),
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + GH,
                      "Content-Type": "application/json",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  response.read()

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for nested in value.values():
                      yield from strings(nested)
              elif isinstance(value, (list, tuple)):
                  for nested in value:
                      yield from strings(nested)

          if not MISTRAL:
              comment(f"MILK_CPANEL_AGENT_BLOCKED run={RUN_ID} cause=MISTRAL_API_KEY_MISSING")
              raise SystemExit(1)

          client = Mistral(api_key=MISTRAL)
          agent = client.beta.agents.create(
              model="mistral-medium-latest",
              name="MILK cPanel Nextcloud Operator",
              description="Executor privado da MILK para cPanel, Nextcloud, WebDAV e migração auditável.",
              instructions=SPEC,
              completion_args={"temperature": 0},
          )
          response = client.beta.conversations.start(
              agent_id=agent.id,
              inputs=(
                  "Aplica as skills do manifesto. Autoriza apenas o preflight cPanel, "
                  "a criação idempotente do subdomínio privado e a migração privada "
                  "quando todas as portas estiverem verificadas. Responde com a frase de controlo."
              ),
              store=False,
          )
          packed = response.model_dump() if hasattr(response, "model_dump") else response
          if "EXECUTE_MILK_CPANEL_NEXTCLOUD_PRIVATE" not in "\n".join(strings(packed)):
              comment(f"MILK_CPANEL_AGENT_BLOCKED run={RUN_ID} cause=MISTRAL_CONTROL_RESPONSE_INVALID")
              raise SystemExit(1)
          comment(
              f"MILK_CPANEL_AGENT_ACTIVE run={RUN_ID} spec_sha256={SPEC_SHA} "
              "skills=9 voice=MILK executor=Mistral secrets_disclosed=0"
          )

          if not CPANEL_TOKEN:
              comment(
                  f"MILK_CPANEL_PREFLIGHT_BLOCKED run={RUN_ID} "
                  "cause=CPANEL_API_TOKEN_MISSING accepted=CPANEL_API_TOKEN,CPANEL_TOKEN,PTSERVIDOR_CPANEL_TOKEN"
              )
              raise SystemExit(1)

          def uapi(module, function, params=None):
              query = urllib.parse.urlencode(params or {})
              url = f"https://{HOST}:2083/execute/{module}/{function}"
              if query:
                  url += "?" + query
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"cpanel {USER}:{CPANEL_TOKEN}",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read())
              status = int(payload.get("status", 0))
              if status != 1:
                  errors = payload.get("errors") or ["unknown"]
                  raise RuntimeError(f"CPANEL_{module}_{function}_FAILED detail={str(errors[0])[:180]}")
              return payload.get("data")

          try:
              data = uapi("DomainInfo", "list_domains")
              serialized = json.dumps(data, ensure_ascii=False)
              exists = DOMAIN in serialized
              if not exists:
                  uapi(
                      "SubDomain",
                      "addsubdomain",
                      {
                          "domain": "nuvem",
                          "rootdomain": ROOT_DOMAIN,
                          "dir": DOCROOT,
                          "disallowdot": 1,
                          "canoff": 0,
                      },
                  )
                  data = uapi("DomainInfo", "list_domains")
                  if DOMAIN not in json.dumps(data, ensure_ascii=False):
                      raise RuntimeError("CPANEL_SUBDOMAIN_NOT_VISIBLE_AFTER_CREATE")
                  state = "created"
              else:
                  state = "existing"
              comment(
                  f"MILK_CPANEL_PRIVATE_SUBDOMAIN_VERIFIED run={RUN_ID} "
                  f"domain={DOMAIN} state={state} protected_domains_untouched=yes"
              )
          except Exception as exc:
              comment(f"MILK_CPANEL_PREFLIGHT_BLOCKED run={RUN_ID} cause={str(exc)[:400]}")
              raise

          base = os.environ.get("NEXTCLOUD_BASE_URL", "").strip()
          nc_user = os.environ.get("NEXTCLOUD_USER", "").strip()
          nc_password = (
              os.environ.get("NEXTCLOUD_APP_PASSWORD", "").strip()
              or os.environ.get("NEXTCLOUD_KEY", "").strip()
          )
          outside = os.environ.get("NEXTCLOUD_DATA_OUTSIDE_WEBROOT_CONFIRMED", "").strip().lower()
          if base and nc_user and nc_password and outside == "yes":
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/workflows/mistral-nextcloud-private-migration.yml/dispatches",
                  data=json.dumps({"ref": "master"}).encode(),
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + GH,
                      "Content-Type": "application/json",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  response.read()
              comment(f"MILK_NEXTCLOUD_MIGRATION_DISPATCHED run={RUN_ID} drive_writes=0")
          else:
              missing = []
              if not base:
                  missing.append("NEXTCLOUD_BASE_URL")
              if not nc_user:
                  missing.append("NEXTCLOUD_USER")
              if not nc_password:
                  missing.append("NEXTCLOUD_APP_PASSWORD")
              if outside != "yes":
                  missing.append("NEXTCLOUD_DATA_OUTSIDE_WEBROOT_CONFIRMED=yes")
              comment(
                  f"MILK_NEXTCLOUD_INSTALLATION_REQUIRED run={RUN_ID} "
                  f"domain={DOMAIN} missing={','.join(missing)}"
              )
          PY
