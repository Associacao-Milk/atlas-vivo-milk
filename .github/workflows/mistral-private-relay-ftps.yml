name: MILK Mistral Private Relay -> PTServidor
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-private-relay-ftps.yml']
permissions:
  contents: read
  issues: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELAY_ID: MILK-BOX-RELAY-20260821-ATLAS-01
      FILE_NAME: takeout-20260702T114704Z-001.zip
    steps:
      - name: Mistral agent receives private Gmail relay and transfers real ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,re,time,hashlib,pathlib,subprocess,urllib.parse
          key=os.environ['MISTRAL_API_KEY']; pwd=os.environ['PTSERVIDOR_FTPS_PASSWORD']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']; relay=os.environ['RELAY_ID']; name=os.environ['FILE_NAME']; tmp=pathlib.Path(os.environ.get('RUNNER_TEMP','/tmp'))
          def comment(msg):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(req,timeout=30).read()
          def get(path):
              req=urllib.request.Request('https://api.mistral.ai'+path,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          def post(path,payload):
              req=urllib.request.Request('https://api.mistral.ai'+path,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=120) as r:return json.loads(r.read().decode())
          agents=get('/v1/agents/pages')
          al=agents.get('data',[]) if isinstance(agents,dict) else agents
          agent=None
          for a in al:
              s=(str(a.get('name',''))+' '+str(a.get('description',''))).lower()
              if 'migra' in s and ('preserv' in s or 'transfer' in s): agent=a;break
          comment('MISTRAL_PRIVATE_RELAY_READY relay_id='+relay+' agent='+(str(agent.get('name')) if agent else 'mistral-runtime')+' drive_writes=0')
          url=None
          for i in range(50):
              prompt=f'Use ONLY the Gmail connector. Search the authenticated mailbox for an email whose exact subject is {relay}. Do not modify mail. If found, return only RELAY_URL=<the single https URL in the plain-text body>. If not found return WAIT.'
              payload={'inputs':[{'role':'user','content':prompt}],'tools':[{'type':'connector','connector_id':'gmail'}]}
              if agent: payload['agent_id']=agent['id']
              else: payload['model']='mistral-small-latest'
              try:
                  conv=post('/v1/conversations',payload)
                  text=' '.join(str(o.get('content','')) for o in conv.get('outputs',[]) if isinstance(o,dict))
                  m=re.search(r'RELAY_URL=(https://\S+)',text)
                  if m:
                      url=m.group(1).strip().rstrip(').,]');break
              except Exception: pass
              time.sleep(3)
          if not url:
              comment('MISTRAL_PRIVATE_RELAY_FAILED reason=gmail_relay_not_received_or_connector_unavailable drive_writes=0');raise SystemExit(20)
          print('::add-mask::'+url)
          comment('MISTRAL_PRIVATE_RELAY_RECEIVED relay_id='+relay+' url_disclosed=no')
          req=urllib.request.Request(url,headers={'User-Agent':'MILK-Mistral-Migration/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r: data=r.read()
          if data[:2]!=b'PK': raise RuntimeError('relay download is not ZIP')
          local=tmp/name;local.write_bytes(data);sha=hashlib.sha256(data).hexdigest();size=len(data)
          comment(f'MISTRAL_RELAY_BINARY_ACQUIRED file={name} bytes={size} sha256={sha}')
          base=['curl','--fail','--silent','--show-error','--ssl-reqd','--ftp-pasv','--connect-timeout','30','--max-time','900','--user','migration@associacaomilk.pt:'+pwd]
          remote_dir='takeout-baseline-2026-07-02'; subprocess.run(base+['--quote','MKD '+remote_dir,'ftp://troi.ptservidor.net:21/'],check=False)
          remote=urllib.parse.quote(name,safe='._-() ');ftpu='ftp://troi.ptservidor.net:21/'+remote_dir+'/'+remote
          subprocess.run(base+['-T',str(local),ftpu],check=True)
          back=tmp/('back-'+name);subprocess.run(base+[ftpu,'-o',str(back)],check=True)
          bsha=hashlib.sha256(back.read_bytes()).hexdigest();bsize=back.stat().st_size
          if sha!=bsha or size!=bsize: raise RuntimeError('FTPS verification mismatch')
          comment(f'MISTRAL_REAL_TRANSFER_VERIFIED file={name} bytes={size} sha256={sha} remote={remote_dir}/{name} source=Box_Google_Takeout_2026-07-02 drive_writes=0')
          PY
