name: cPanel existing credential recovery

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cpanel-existing-credential-recovery.yml'

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      PTSERVIDOR_CPANEL_TOKEN: ${{ secrets.PTSERVIDOR_CPANEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Probe existing cPanel credential routes without disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,ssl,urllib.request,urllib.error

          user='associ16'
          gh=os.environ.get('GH_TOKEN','').strip()
          repo=os.environ.get('REPO','milkivc/atlas-vivo-milk')
          run_id=os.environ.get('RUN_ID','unknown')
          hosts=['troi.ptservidor.net','associacaomilk.pt']

          candidates=[]
          for label in ('CPANEL_API_TOKEN','CPANEL_TOKEN','PTSERVIDOR_CPANEL_TOKEN','PTSERVIDOR_FTPS_PASSWORD','PTSERVIDOR_FTP_WEBDAV','NEXTCLOUD_KEY'):
              value=os.environ.get(label,'').strip()
              if value and all(value!=v for _,v,_ in candidates):
                  mode='token' if 'TOKEN' in label else 'basic'
                  candidates.append((label,value,mode))

          def comment(msg):
              print(msg,flush=True)
              if not gh:return
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/35/comments',
                  data=json.dumps({'body':msg}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              try: urllib.request.urlopen(req,timeout=30).read()
              except Exception: pass

          winner=None; attempts=[]
          ctx=ssl.create_default_context()
          for host in hosts:
              url=f'https://{host}:2083/execute/Variables/get_user_information?name=home&name-1=user&name-2=main_domain'
              for label,value,mode in candidates:
                  headers={'Accept':'application/json'}
                  if mode=='token':
                      headers['Authorization']=f'cpanel {user}:{value}'
                  else:
                      raw=base64.b64encode(f'{user}:{value}'.encode()).decode()
                      headers['Authorization']='Basic '+raw
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                          body=json.loads(r.read())
                      result=body.get('result',{})
                      ok=int(result.get('status',0) or 0)==1
                      attempts.append(f'{label}:{mode}:{host}:status{1 if ok else 0}')
                      if ok:
                          data=result.get('data') or {}
                          home=data.get('home') if isinstance(data,dict) else None
                          winner=(label,value,mode,host,home)
                          break
                  except urllib.error.HTTPError as e:
                      attempts.append(f'{label}:{mode}:{host}:http{e.code}')
                  except Exception as e:
                      attempts.append(f'{label}:{mode}:{host}:error')
              if winner: break

          if not winner:
              comment(f'CPANEL_EXISTING_CREDENTIAL_RECOVERY_BLOCKED run={run_id} attempts={len(attempts)} results={";".join(attempts)} secret_values_disclosed=0')
              raise SystemExit(1)

          label,value,mode,host,home=winner
          safe_home=str(home or '').replace('\n',' ')[:160]
          comment(f'CPANEL_EXISTING_CREDENTIAL_RECOVERED run={run_id} route={label} auth_mode={mode} host={host} home={safe_home} secret_values_disclosed=0')

          # Read-only discovery now that the account control plane is authenticated.
          headers={'Accept':'application/json'}
          if mode=='token': headers['Authorization']=f'cpanel {user}:{value}'
          else: headers['Authorization']='Basic '+base64.b64encode(f'{user}:{value}'.encode()).decode()
          for module,function in [('DomainInfo','list_domains'),('Fileman','list_files')]:
              if module=='Fileman':
                  url=f'https://{host}:2083/execute/{module}/{function}?dir=public_html&show_hidden=1'
              else:
                  url=f'https://{host}:2083/execute/{module}/{function}'
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=25,context=ctx) as r: payload=json.loads(r.read())
                  result=payload.get('result',{})
                  if int(result.get('status',0) or 0)!=1: continue
                  data=result.get('data')
                  if module=='Fileman':
                      items=data if isinstance(data,list) else ((data or {}).get('files',[]) if isinstance(data,dict) else [])
                      names=[]
                      for item in items:
                          if isinstance(item,dict):
                              name=str(item.get('file') or item.get('name') or item.get('path') or '')
                              if 'nextcl' in name.lower(): names.append(name)
                      comment(f'CPANEL_NEXTCLOUD_PATH_DISCOVERY run={run_id} candidates={",".join(names[:20]) or "none"} content_disclosed=0')
                  else:
                      comment(f'CPANEL_DOMAIN_DISCOVERY_OK run={run_id} secret_values_disclosed=0')
              except Exception:
                  pass
          PY
