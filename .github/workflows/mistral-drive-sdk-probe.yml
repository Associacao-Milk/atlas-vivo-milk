name: MILK Mistral Drive SDK Probe
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-drive-sdk-probe.yml']
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Install official Mistral SDK
        run: python -m pip install --quiet mistralai==2.9.3
      - name: Validate Drive MCP credentials and exact search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from mistralai.client import Mistral
          key=os.environ["MISTRAL_API_KEY"]; gh=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]
          cid="google_drive_mcp"
          target="WORK_HANDOFF_ATLAS_VIVO_MILK_2026-08-12__TRANSFERENCIA_STAGING.zip"
          target_id="1GJFngHQP3D-IbmFdzyW8Q_3EzcRhBTv".replace("zyW8","zyF08")
          def comment(msg):
              q=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/35/comments",data=json.dumps({"body":msg}).encode(),method="POST",headers={"Authorization":"Bearer "+gh,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
              urllib.request.urlopen(q,timeout=30).read()
          with Mistral(api_key=key) as client:
              cred_count=-1; cred_default=0
              try:
                  creds=client.beta.connectors.list_user_credentials(connector_id_or_name=cid)
                  items=getattr(creds,"items",None) or getattr(creds,"data",None) or []
                  cred_count=len(items)
                  cred_default=sum(1 for x in items if bool(getattr(x,"is_default",False)))
              except Exception:
                  cred_count=0
              comment(f"MISTRAL_DRIVE_SDK_CREDENTIALS connector={cid} count={cred_count} defaults={cred_default} drive_writes=0")
              try:
                  result=client.beta.connectors.call_tool(connector_id_or_name=cid,tool_name="search_files",arguments={"query":target})
                  raw=str(result)
                  found=(target in raw or target_id in raw)
                  if found:
                      comment("MISTRAL_DRIVE_SDK_SEARCH_VALIDATED connector="+cid+" target_bytes=23380653 drive_writes=0")
                  else:
                      comment("MISTRAL_DRIVE_SDK_SEARCH_EMPTY connector="+cid+" credential_count="+str(cred_count)+" drive_writes=0")
                      raise SystemExit(24)
              except SystemExit: raise
              except Exception as e:
                  code=getattr(e,"status_code",None) or getattr(e,"status",None) or "error"
                  comment("MISTRAL_DRIVE_SDK_SEARCH_FAILED connector="+cid+" credential_count="+str(cred_count)+" status="+str(code)+" drive_writes=0")
                  raise
          PY
