name: MILK Runner Sealed Transport Key
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-gmail-signed-relay-ftps.yml']
permissions:
  contents: read
  issues: write
jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Generate RSA key and seal private key with existing runner secret
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q cryptography
          python - <<'PY'
          import os,json,urllib.request,base64,hashlib,secrets
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          pwd=os.environ.get('PTSERVIDOR_FTPS_PASSWORD',''); gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          if not pwd:
              comment('MILK_RUNNER_KEYGEN_FAILED reason=ftps_secret_empty'); raise SystemExit(20)
          priv=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          pub=priv.public_key()
          priv_pem=priv.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption())
          pub_pem=pub.public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo)
          salt=secrets.token_bytes(16); nonce=secrets.token_bytes(12)
          key=hashlib.pbkdf2_hmac('sha256',pwd.encode(),salt,600000,dklen=32)
          sealed=b'MILKKEY1'+salt+nonce+AESGCM(key).encrypt(nonce,priv_pem,b'MILK-RUNNER-KEY-v1')
          comment('MILK_RUNNER_PUBLIC_KEY_B64 '+base64.b64encode(pub_pem).decode())
          comment('MILK_RUNNER_SEALED_PRIVATE_KEY_B64 '+base64.b64encode(sealed).decode())
          comment('MILK_RUNNER_KEYGEN_READY ftps_secret_present=yes private_key_disclosed=no')
          PY
