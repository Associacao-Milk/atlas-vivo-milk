name: MILK Mistral Drive Auth State NOW
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-drive-auth-state-now.yml']
permissions:
  contents: read
  issues: write
jobs:
  authstate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DRIVE_SOMOSTODOSPOSSIVEIS: ${{ secrets.DRIVE_SOMOSTODOSPOSSIVEIS }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Query native Mistral Drive connector auth state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,hashlib
          key=os.environ['MISTRAL_API_KEY']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']; opaque=os.environ.get('DRIVE_SOMOSTODOSPOSSIVEIS','')
          def comment(msg):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(req,timeout=30).read()
          def get(path):
              req=urllib.request.Request('https://api.mistral.ai'+path,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          comment('MISTRAL_DRIVE_AUTHSTATE_STARTED drive_writes=0')
          connector=get('/v1/connectors/google_drive?fetch_user_data=true&fetch_customer_data=false')
          methods=get('/v1/connectors/google_drive/authentication_methods')
          creds=get('/v1/connectors/google_drive/user/credentials?fetch_default=true')
          method_names=[]
          if isinstance(methods,list):
              for m in methods:
                  method_names.append(str(m.get('type') or m.get('auth_type') or m.get('name') or 'unknown') if isinstance(m,dict) else str(m))
          cl=(creds or {}).get('credentials') if isinstance(creds,dict) else None
          preset=(creds or {}).get('connector_preset_credentials_for_auth') if isinstance(creds,dict) else None
          comment('MISTRAL_DRIVE_AUTHSTATE active='+str(connector.get('active'))+' methods='+','.join(method_names)+' user_credentials_count='+str(len(cl or []))+' preset='+','.join(map(str,preset or []))+' opaque_present='+('yes' if opaque else 'no')+' opaque_fp12='+hashlib.sha256(opaque.encode()).hexdigest()[:12])
          try:
              au=get('/v1/connectors/google_drive/auth_url')
              comment('MISTRAL_DRIVE_AUTH_URL_READY available='+('yes' if isinstance(au,dict) and bool(au.get('auth_url')) else 'no')+' ttl='+str(au.get('ttl') if isinstance(au,dict) else None))
          except Exception as e:
              comment('MISTRAL_DRIVE_AUTH_URL_ERROR type='+type(e).__name__)
          PY
