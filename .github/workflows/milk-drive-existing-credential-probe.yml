name: MILK probe existing Drive credential routes

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/milk-drive-existing-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG_SECRET }}
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
      GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      DRIVE_SOMOSTODOSPOSSIVEIS: ${{ secrets.DRIVE_SOMOSTODOSPOSSIVEIS }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
    steps:
      - name: Report presence only and test usable Google routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess, tempfile, pathlib, urllib.request, urllib.error

          names=[
            'RCLONE_CONFIG_SECRET','RCLONE_CONFIG','GOOGLE_SERVICE_ACCOUNT_JSON',
            'GOOGLE_APPLICATION_CREDENTIALS_JSON','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET',
            'GOOGLE_REFRESH_TOKEN','GOOGLE_OAUTH_CLIENT_JSON','GOOGLE_OAUTH_TOKEN_JSON',
            'GOOGLE_DRIVE_TOKEN','GDRIVE_TOKEN','DRIVE_SOMOSTODOSPOSSIVEIS',
            'PTSERVIDOR_FTPS_PASSWORD','NEXTCLOUD_BASE_URL','NEXTCLOUD_USER',
            'NEXTCLOUD_APP_PASSWORD','NEXTCLOUD_KEY'
          ]
          presence={n: bool(os.environ.get(n,'').strip()) for n in names}
          usable=[]
          tested=[]

          def bearer_ok(token):
            if not token: return False
            req=urllib.request.Request('https://www.googleapis.com/drive/v3/about?fields=user',headers={'Authorization':'Bearer '+token})
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                return 200 <= r.status < 300
            except Exception:
              return False

          for n in ('GOOGLE_DRIVE_TOKEN','GDRIVE_TOKEN','DRIVE_SOMOSTODOSPOSSIVEIS'):
            v=os.environ.get(n,'').strip()
            if v:
              tested.append(n+':bearer')
              if bearer_ok(v): usable.append(n+':bearer')

          # Structural tests only; no secret contents printed.
          for n in ('GOOGLE_SERVICE_ACCOUNT_JSON','GOOGLE_APPLICATION_CREDENTIALS_JSON'):
            v=os.environ.get(n,'').strip()
            if v:
              tested.append(n+':service_account_shape')
              try:
                d=json.loads(v)
                if d.get('type')=='service_account' and d.get('client_email') and d.get('private_key') and d.get('token_uri'):
                  usable.append(n+':service_account_shape')
              except Exception: pass

          if all(os.environ.get(n,'').strip() for n in ('GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','GOOGLE_REFRESH_TOKEN')):
            tested.append('AUTHORIZED_USER_TRIPLE:shape')
            usable.append('AUTHORIZED_USER_TRIPLE:shape')

          for n in ('RCLONE_CONFIG_SECRET','RCLONE_CONFIG'):
            v=os.environ.get(n,'').strip()
            if v:
              tested.append(n+':rclone_shape')
              if re.search(r'^\s*type\s*=\s*drive\s*$',v,re.M): usable.append(n+':rclone_shape')

          compact_presence=','.join(n+'='+('yes' if presence[n] else 'no') for n in names)
          body=(f"MILK_DRIVE_SECRET_ROUTES_PROBED run={os.environ['RUN_ID']} "
                f"presence={compact_presence} tested={';'.join(tested) or 'none'} "
                f"usable={';'.join(usable) or 'none'} values_disclosed=0")
          print(body)
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments",
            data=json.dumps({'body':body}).encode(),method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
