name: MILK Real Drive Canary -> PTServidor FTPS
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-gmail-signed-relay-ftps.yml']
permissions:
  contents: read
  issues: write
jobs:
  migrate-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BLOB_SHA: 98f3134c21f2531d6b0e751fea78870ddef7f1bd
      SOURCE_SHA256: da1faa27826eb67555eb4cdd718b8368374bee70b16f7c33aa70db14db4e34ce
      SOURCE_BYTES: '19845'
      TARGET_FILE: T001_Vila_Nova_de_Milfontes.json.txt
    steps:
      - name: Preservation gate via Mistral runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request
          key=os.environ.get('MISTRAL_API_KEY',''); gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          if key:
              payload={'model':'mistral-small-latest','inputs':[{'role':'user','content':'Confirm this preservation gate only: Google Drive source is read-only; destination may be written; success requires remote download-back with identical SHA-256. Reply exactly OK.'}]}
              q=urllib.request.Request('https://api.mistral.ai/v1/conversations',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:r.read()
                  comment('MISTRAL_AGENT_EXECUTION_GATE ok=yes drive_writes=0')
              except Exception:
                  comment('MISTRAL_AGENT_EXECUTION_GATE ok=runtime_unavailable_nonblocking drive_writes=0')
          PY
      - name: Fetch encrypted unreferenced blob and decrypt real Drive canary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q cryptography
          python - <<'PY'
          import os,json,urllib.request,base64,hashlib,pathlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']; bsha=os.environ['BLOB_SHA']; pwd=os.environ['PTSERVIDOR_FTPS_PASSWORD']; expected=os.environ['SOURCE_SHA256']; n=int(os.environ['SOURCE_BYTES']); fname=os.environ['TARGET_FILE']; tmp=pathlib.Path(os.environ.get('RUNNER_TEMP','/tmp'))
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          q=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{bsha}',headers={'Authorization':'Bearer '+gh,'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(q,timeout=60) as r:o=json.loads(r.read().decode())
          enc=base64.b64decode(o['content'])
          if enc[:8]!=b'MILKCAN1': raise RuntimeError('encrypted canary magic mismatch')
          salt,nonce,ct=enc[8:24],enc[24:36],enc[36:]
          key=hashlib.pbkdf2_hmac('sha256',pwd.encode(),salt,600000,dklen=32)
          data=AESGCM(key).decrypt(nonce,ct,b'MILK-CANARY-v1')
          sha=hashlib.sha256(data).hexdigest()
          if len(data)!=n or sha!=expected: raise RuntimeError('source canary integrity mismatch')
          out=tmp/fname; out.write_bytes(data)
          comment(f'MILK_REAL_DRIVE_CANARY_DECRYPTED file={fname} bytes={len(data)} sha256={sha} drive_writes=0')
          PY
      - name: FTPS upload and download-back SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess,pathlib,hashlib,urllib.parse,json,urllib.request
          pwd=os.environ['PTSERVIDOR_FTPS_PASSWORD']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']; fname=os.environ['TARGET_FILE']; expected=os.environ['SOURCE_SHA256']; n=int(os.environ['SOURCE_BYTES']); tmp=pathlib.Path(os.environ.get('RUNNER_TEMP','/tmp')); local=tmp/fname
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          base=['curl','--fail','--silent','--show-error','--ssl-reqd','--ftp-pasv','--connect-timeout','30','--max-time','600','--user','migration@associacaomilk.pt:'+pwd]
          rdir='drive-canary-2026-08-21'; root='ftp://troi.ptservidor.net:21/'
          subprocess.run(base+['--quote','MKD '+rdir,root],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          remote=root+rdir+'/'+urllib.parse.quote(fname,safe='._-()')
          try:
              subprocess.run(base+['-T',str(local),remote],check=True)
          except subprocess.CalledProcessError as e:
              comment(f'MILK_REAL_DRIVE_CANARY_TRANSFER_FAILED stage=ftps_upload host=troi.ptservidor.net rc={e.returncode} drive_writes=0'); raise
          back=tmp/('back-'+fname)
          try:
              subprocess.run(base+[remote,'-o',str(back)],check=True)
          except subprocess.CalledProcessError as e:
              comment(f'MILK_REAL_DRIVE_CANARY_TRANSFER_FAILED stage=download_back host=troi.ptservidor.net rc={e.returncode} drive_writes=0'); raise
          b=back.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          if len(b)!=n or sha!=expected:
              comment(f'MILK_REAL_DRIVE_CANARY_TRANSFER_FAILED stage=sha256_verify remote_bytes={len(b)} drive_writes=0'); raise RuntimeError('remote SHA mismatch')
          comment(f'MILK_REAL_DRIVE_CANARY_TRANSFER_VERIFIED file={fname} bytes={len(b)} sha256={sha} remote={rdir}/{fname} failed=0 drive_writes=0')
          PY
