name: Nextcloud admin password reset request

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/nextcloud-password-reset-request.yml'

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request one native Nextcloud password reset for admin
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://associacaomilk.pt/nextcloud/index.php/lostpassword/email'
          response="$(curl --fail-with-body --silent --show-error --location \
            --max-time 30 \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'user=admin' \
            "$endpoint")"
          printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="success", d; print("NEXTCLOUD_RESET_REQUEST_ACCEPTED user=admin")'
