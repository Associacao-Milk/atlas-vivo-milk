name: Nextcloud Atlas credential probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/nextcloud-atlas-secret-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXTCLOUD_ATLAS: ${{ secrets.NEXTCLOUD_ATLAS }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Probe existing Nextcloud credentials without writes or disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, ssl, urllib.parse, urllib.request, urllib.error

          base='https://associacaomilk.pt/nextcloud'
          users=['admin','milk','associ16','migration@associacaomilk.pt']
          routes=[]
          for label in ('NEXTCLOUD_ATLAS','NEXTCLOUD_KEY','PTSERVIDOR_FTP_WEBDAV'):
              value=os.environ.get(label,'').strip()
              if value and all(value != v for _,v in routes): routes.append((label,value))
          if not routes: raise SystemExit('NEXTCLOUD_EXISTING_CREDENTIALS_MISSING')

          results=[]; winner=None
          ctx=ssl.create_default_context()
          for label,password in routes:
              for user in users:
                  endpoint=base.rstrip('/')+'/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/'
                  raw=base64.b64encode((user+':'+password).encode()).decode()
                  req=urllib.request.Request(endpoint,method='PROPFIND',headers={
                      'Authorization':'Basic '+raw,'Depth':'0','Accept':'application/xml'})
                  try:
                      with urllib.request.urlopen(req,timeout=25,context=ctx) as r:
                          status=r.status
                      ok=status in (200,207)
                  except urllib.error.HTTPError as e:
                      status=e.code; ok=False
                  except Exception:
                      status='error'; ok=False
                  results.append(f'{label}|{user}|{status}')
                  if ok:
                      winner=(label,user,status); break
              if winner: break

          gh=os.environ.get('GH_TOKEN','').strip(); repo=os.environ.get('REPO',''); run_id=os.environ.get('RUN_ID','')
          if winner:
              label,user,status=winner
              msg=f'NEXTCLOUD_ATLAS_CREDENTIAL_VERIFIED run={run_id} route={label} user={user} http={status} writes=0 secret_values_disclosed=0'
          else:
              msg=f'NEXTCLOUD_ATLAS_CREDENTIAL_BLOCKED run={run_id} results={";".join(results)} writes=0 secret_values_disclosed=0'
          print(msg)
          if gh and repo:
              data=json.dumps({'body':msg}).encode()
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=data,method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              try: urllib.request.urlopen(q,timeout=30).read()
              except Exception: pass
          if not winner: raise SystemExit(1)
          PY
