name: MILK Mistral Gmail Signed Relay -> PTServidor
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-gmail-signed-relay-ftps.yml']
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELAY_SUBJECT: MILK-MISTRAL-GMAIL-SIGNED-RELAY-20260821-0219
      TARGET_FILE: ATLAS_VIVO_MILK_CURADORIAS_FISICAS_DIGITAIS_CORPO_INTEGRAL_2026-08-08.docx
    steps:
      - name: Mistral relay -> FTPS -> download-back SHA256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.error,re,hashlib,pathlib,subprocess,urllib.parse,time,html
          key=os.environ['MISTRAL_API_KEY']; pwd=os.environ['PTSERVIDOR_FTPS_PASSWORD']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']; subject=os.environ['RELAY_SUBJECT']; fname=os.environ['TARGET_FILE']; tmp=pathlib.Path(os.environ.get('RUNNER_TEMP','/tmp'))
          def comment(msg):
              q=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(q,timeout=30).read()
          def get(path):
              q=urllib.request.Request('https://api.mistral.ai'+path,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.loads(r.read().decode())
          def post(path,payload):
              q=urllib.request.Request('https://api.mistral.ai'+path,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=180) as r:return json.loads(r.read().decode())
          agents=get('/v1/agents/pages'); al=agents.get('data',[]) if isinstance(agents,dict) else agents; agent=None
          for a in al:
              s=(str(a.get('name',''))+' '+str(a.get('description',''))).lower()
              if 'migra' in s and ('preserv' in s or 'transfer' in s): agent=a; break
          comment('MISTRAL_GMAIL_SIGNED_RELAY_V3_STARTED agent='+(str(agent.get('name')) if agent else 'runtime')+' drive_writes=0')
          url=None
          for _ in range(6):
              prompt=f'Use ONLY Gmail connector read-only. Search exact subject "{subject}" and open the matching thread. The thread contains multiple RELAY_URL= lines. Return ONLY the LAST/MOST RECENT RELAY_URL value as one line RELAY_URL=<complete https URL>. Do not modify mail.'
              payload={'inputs':[{'role':'user','content':prompt}],'tools':[{'type':'connector','connector_id':'gmail'}]}
              if agent: payload['agent_id']=agent['id']
              else: payload['model']='mistral-small-latest'
              try:
                  conv=post('/v1/conversations',payload)
                  text=' '.join(str(x.get('content','')) for x in conv.get('outputs',[]) if isinstance(x,dict))
                  matches=re.findall(r'RELAY_URL=(https://[^\s<>]+)',text)
                  if matches:
                      url=html.unescape(matches[-1]).strip().strip('`"\'').rstrip(').,]'); break
              except Exception: pass
              time.sleep(1)
          if not url:
              comment('MISTRAL_GMAIL_SIGNED_RELAY_V3_FAILED stage=resolve_url drive_writes=0'); raise SystemExit(20)
          print('::add-mask::'+url); comment('MISTRAL_GMAIL_SIGNED_RELAY_V3_RESOLVED url_disclosed=no drive_writes=0')
          try:
              q=urllib.request.Request(url,headers={'User-Agent':'MILK-Mistral-Migration/3.0','Accept':'*/*'})
              with urllib.request.urlopen(q,timeout=300) as r: data=r.read(); http_status=getattr(r,'status',200)
          except urllib.error.HTTPError as e:
              comment(f'MISTRAL_GMAIL_SIGNED_RELAY_V3_FAILED stage=http_download http_status={e.code} url_disclosed=no drive_writes=0'); raise
          if len(data)!=11395370 or data[:2]!=b'PK':
              comment(f'MISTRAL_GMAIL_SIGNED_RELAY_V3_FAILED stage=binary_validation bytes={len(data)} http_status={http_status} drive_writes=0'); raise RuntimeError('binary validation failed')
          local=tmp/fname; local.write_bytes(data); size=len(data); sha=hashlib.sha256(data).hexdigest()
          comment(f'MISTRAL_REAL_DRIVE_BINARY_ACQUIRED file={fname} bytes={size} sha256={sha} drive_writes=0')
          base=['curl','--fail','--silent','--show-error','--ssl-reqd','--ftp-pasv','--connect-timeout','30','--max-time','1200','--user','migration@associacaomilk.pt:'+pwd]
          rdir='drive-current-relay-2026-08-21'; subprocess.run(base+['--quote','MKD '+rdir,'ftp://troi.ptservidor.net:21/'],check=False)
          ftpu='ftp://troi.ptservidor.net:21/'+rdir+'/'+urllib.parse.quote(fname,safe='._-() ')
          try: subprocess.run(base+['-T',str(local),ftpu],check=True)
          except subprocess.CalledProcessError as e:
              comment(f'MISTRAL_REAL_DRIVE_FILE_TRANSFER_FAILED stage=ftps_upload rc={e.returncode} bytes=0 drive_writes=0'); raise
          back=tmp/('back-'+fname); subprocess.run(base+[ftpu,'-o',str(back)],check=True)
          bsize=back.stat().st_size; bsha=hashlib.sha256(back.read_bytes()).hexdigest()
          if bsize!=size or bsha!=sha:
              comment(f'MISTRAL_REAL_DRIVE_FILE_TRANSFER_FAILED stage=download_back_verify remote_bytes={bsize} drive_writes=0'); raise RuntimeError('SHA256 mismatch')
          comment(f'MISTRAL_REAL_DRIVE_FILE_TRANSFER_VERIFIED file={fname} bytes={size} sha256={sha} remote={rdir}/{fname} failed=0 drive_writes=0')
          PY
