name: MILK — validar credenciais opacas
run-name: Validar credenciais sem revelar valores

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-opaque-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISTRAL_PRIMARY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_FALLBACK_1: ${{ secrets.MISTRALPI_KEY }}
      MISTRAL_FALLBACK_2: ${{ secrets.MISTRAL_ALL_CODEBERG }}
      CODEBERG_PRIMARY: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_FALLBACK: ${{ secrets.CODEBERG_KEY }}
    steps:
      - name: Validar Mistral sem expor segredo
        id: mistral
        shell: bash
        run: |
          set -euo pipefail
          token="${MISTRAL_PRIMARY:-}"
          source_name=MISTRAL_API_KEY
          if [ -z "$token" ]; then token="${MISTRAL_FALLBACK_1:-}"; source_name=MISTRALPI_KEY; fi
          if [ -z "$token" ]; then token="${MISTRAL_FALLBACK_2:-}"; source_name=MISTRAL_ALL_CODEBERG; fi
          if [ -z "$token" ]; then
            echo "status=MISSING" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $token" https://api.mistral.ai/v1/models || true)
          if [ "$status" = 200 ]; then result=VALID; else result=INVALID_HTTP_$status; fi
          echo "status=$result" >> "$GITHUB_OUTPUT"
          echo "source=$source_name" >> "$GITHUB_OUTPUT"

      - name: Validar Codeberg sem expor segredo
        id: codeberg
        shell: bash
        run: |
          set -euo pipefail
          token="${CODEBERG_PRIMARY:-}"
          source_name=CODEBERG_TOKEN
          if [ -z "$token" ]; then token="${CODEBERG_FALLBACK:-}"; source_name=CODEBERG_KEY; fi
          if [ -z "$token" ]; then
            echo "status=MISSING" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-user.json" -w '%{http_code}'             -H "Authorization: token $token" https://codeberg.org/api/v1/user || true)
          if [ "$status" = 200 ]; then result=VALID; else result=INVALID_HTTP_$status; fi
          echo "status=$result" >> "$GITHUB_OUTPUT"
          echo "source=$source_name" >> "$GITHUB_OUTPUT"

      - name: Publicar recibo sem valores
        shell: bash
        env:
          MISTRAL_STATUS: ${{ steps.mistral.outputs.status }}
          MISTRAL_SOURCE: ${{ steps.mistral.outputs.source }}
          CODEBERG_STATUS: ${{ steps.codeberg.outputs.status }}
          CODEBERG_SOURCE: ${{ steps.codeberg.outputs.source }}
        run: |
          {
            echo "## Validação de credenciais opacas"
            echo ""
            echo "| Serviço | Estado | Nome utilizado | Valor exposto |"
            echo "|---|---|---|---|"
            echo "| Mistral | $MISTRAL_STATUS | $MISTRAL_SOURCE | não |"
            echo "| Codeberg | $CODEBERG_STATUS | $CODEBERG_SOURCE | não |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$MISTRAL_STATUS" = VALID
          test "$CODEBERG_STATUS" = VALID
