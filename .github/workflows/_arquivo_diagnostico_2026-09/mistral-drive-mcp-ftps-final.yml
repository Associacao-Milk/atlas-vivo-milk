name: MILK Mistral Drive MCP -> PTServidor Verified
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-drive-mcp-ftps-final.yml']
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - run: python -m pip install --quiet mistralai==2.9.3
      - name: Mistral downloads exact Drive object and transfers by verified FTPS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,ftplib,hashlib,json,os,pathlib,re,ssl,urllib.parse,urllib.request
          from mistralai.client import Mistral
          key=os.environ["MISTRAL_API_KEY"];pwd=os.environ["PTSERVIDOR_FTPS_PASSWORD"];gh=os.environ["GH_TOKEN"];repo=os.environ["REPO"]
          cid="google_drive_mcp";file_id="1GJFngHQP3D-IbmFdzyF08Q_3EzcRhBTv"
          name="WORK_HANDOFF_ATLAS_VIVO_MILK_2026-08-12__TRANSFERENCIA_STAGING.zip";expected=23380653
          drive_url="https://drive.google.com/file/d/"+file_id+"/view"
          tmp=pathlib.Path(os.environ.get("RUNNER_TEMP","/tmp"));local=tmp/name
          def comment(msg):
              q=urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/35/comments",data=json.dumps({"body":msg}).encode(),method="POST",headers={"Authorization":"Bearer "+gh,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
              urllib.request.urlopen(q,timeout=30).read()
          def dump(x):
              if hasattr(x,"model_dump"):return x.model_dump()
              if isinstance(x,dict):return x
              return {"text":str(x)}
          def tool_schema(tools,tool_name):
              items=getattr(tools,"items",None) or getattr(tools,"data",None) or tools
              for t in items:
                  if str(getattr(t,"name",""))==tool_name:
                      d=dump(t);return d.get("input_schema") or d.get("inputSchema") or {}
              raise RuntimeError("tool schema not found: "+tool_name)
          def args_for(schema,mode):
              props=(schema.get("properties") or {}) if isinstance(schema,dict) else {}
              out={}
              for p,spec in props.items():
                  low=p.lower()
                  if low in ("file_id","fileid","id") or ("file" in low and "id" in low):out[p]=file_id
                  elif "url" in low:out[p]=drive_url
                  elif mode=="search" and low in ("query","q","search_query","name","filename","file_name"):out[p]=name
                  elif low in ("page_size","limit","topn","top_k","max_results"):out[p]=50
              return out
          def find_binary(obj):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      low=k.lower()
                      if isinstance(v,str) and low in ("blob","data","base64","base64_content","b64_string") and len(v)>1000:
                          try:return base64.b64decode(v)
                          except Exception:
                              try:return base64.urlsafe_b64decode(v+"="*((4-len(v)%4)%4))
                              except Exception:pass
                  for v in obj.values():
                      got=find_binary(v)
                      if got is not None:return got
              elif isinstance(obj,list):
                  for v in obj:
                      got=find_binary(v)
                      if got is not None:return got
              return None
          def find_url(obj):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if isinstance(v,str) and v.startswith("https://") and any(x in k.lower() for x in ("url","uri","href","download")):return v
                  for v in obj.values():
                      got=find_url(v)
                      if got:return got
              elif isinstance(obj,list):
                  for v in obj:
                      got=find_url(v)
                      if got:return got
              return None
          with Mistral(api_key=key) as client:
              creds=client.beta.connectors.list_user_credentials(connector_id_or_name=cid)
              ci=getattr(creds,"items",None) or getattr(creds,"data",None) or []
              if not ci:
                  comment("MISTRAL_DRIVE_FINAL_FAILED stage=oauth credential_count=0 drive_writes=0");raise SystemExit(30)
              agents=client.beta.agents.list_pages()
              al=getattr(agents,"items",None) or getattr(agents,"data",None) or []
              agent=next((a for a in al if "migra" in (str(getattr(a,"name",""))+" "+str(getattr(a,"description",""))).lower()),None)
              if agent:
                  conv=client.beta.conversations.start(agent_id=str(getattr(agent,"id")),inputs=[{"role":"user","content":"Authorize execution of the already-approved preservative transfer for one exact Google Drive object to PTServidor. Source writes forbidden. Return EXECUTE_MIGRATION."}])
                  if "EXECUTE_MIGRATION" not in str(conv):raise RuntimeError("migration agent did not execute")
              comment("MISTRAL_DRIVE_FINAL_STARTED agent="+(str(getattr(agent,"name","mistral-runtime")) if agent else "mistral-runtime")+f" file={name} expected_bytes={expected} drive_writes=0")
              tools=client.beta.connectors.list_tools(connector_id_or_name=cid,pretty=True)
              sres=client.beta.connectors.call_tool(connector_id_or_name=cid,tool_name="search_files",arguments=args_for(tool_schema(tools,"search_files"),"search"))
              if file_id not in str(sres) and name not in str(sres):raise RuntimeError("exact Drive target not found")
              dres=client.beta.connectors.call_tool(connector_id_or_name=cid,tool_name="download_file_content",arguments=args_for(tool_schema(tools,"download_file_content"),"download"))
              obj=dump(dres);data=find_binary(obj)
              if data is None:
                  url=find_url(obj)
                  if not url:raise RuntimeError("download tool returned no consumable binary or URL")
                  print("::add-mask::"+url)
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"MILK-Mistral-Migration/1.0"}),timeout=300) as r:data=r.read()
          if len(data)!=expected or data[:2]!=b"PK":raise RuntimeError("Drive binary size/signature mismatch")
          local.write_bytes(data);sha=hashlib.sha256(data).hexdigest()
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30);ftp.connect("troi.ptservidor.net",21);ftp.login("migration@associacaomilk.pt",pwd);ftp.prot_p()
          remote_dir="atlas-staging-2026-08-12"
          try:ftp.mkd(remote_dir)
          except ftplib.all_errors:pass
          ftp.cwd(remote_dir)
          with local.open("rb") as fh:ftp.storbinary("STOR "+name,fh,blocksize=1024*1024)
          back=tmp/("back-"+name)
          with back.open("wb") as fh:ftp.retrbinary("RETR "+name,fh.write,blocksize=1024*1024)
          ftp.quit()
          bsha=hashlib.sha256(back.read_bytes()).hexdigest();bsize=back.stat().st_size
          if bsize!=expected or bsha!=sha:raise RuntimeError("FTPS destination verification mismatch")
          comment(f"MISTRAL_DRIVE_FINAL_VERIFIED file={name} bytes={bsize} sha256={sha} remote={remote_dir}/{name} source_drive_id={file_id} drive_writes=0")
          PY
