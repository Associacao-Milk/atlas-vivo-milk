name: MILK Mistral Box -> PTServidor REAL
on:
  push:
    branches: [master]
    paths: ['.github/workflows/mistral-box-ftps-real.yml']
permissions:
  contents: read
  issues: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Mistral Box real Takeout ZIP transfer with FTPS verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,re,base64,hashlib,pathlib,subprocess
          key=os.environ['MISTRAL_API_KEY']; pwd=os.environ['PTSERVIDOR_FTPS_PASSWORD']; gh=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          tmp=pathlib.Path(os.environ.get('RUNNER_TEMP','/tmp'))
          def comment(msg):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+gh,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              urllib.request.urlopen(req,timeout=30).read()
          def call(tool,args):
              url='https://api.mistral.ai/v1/connectors/box/tools/'+urllib.parse.quote(tool,safe='')+'/call'
              req=urllib.request.Request(url,data=json.dumps({'arguments':args}).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r:return json.loads(r.read().decode())
          def expand(x):
              out=[]
              def rec(v):
                  if isinstance(v,dict):
                      out.append(v)
                      for z in v.values(): rec(z)
                  elif isinstance(v,list):
                      for z in v: rec(z)
                  elif isinstance(v,str):
                      s=v.strip()
                      if s and s[0:1] in '[{':
                          try: rec(json.loads(s))
                          except: pass
              rec(x); return out
          def find_folder_id(resp):
              for d in expand(resp):
                  name=str(d.get('name') or d.get('folder_name') or '')
                  typ=str(d.get('type') or '')
                  if 'takeout' in name.lower() and (typ in ('folder','') or 'folder' in typ):
                      for k in ('id','folder_id'):
                          if d.get(k): return str(d[k])
              text=json.dumps(resp)
              m=re.search(r'"(?:folder_id|id)"\s*:\s*"?(\d+)"?',text)
              return m.group(1) if m else None
          def zip_items(resp):
              items=[]
              for d in expand(resp):
                  name=str(d.get('name') or d.get('file_name') or '')
                  if name.lower().endswith('.zip'):
                      fid=d.get('id') or d.get('file_id'); size=d.get('size') or d.get('size_bytes') or 10**30
                      if fid:
                          try:size=int(size)
                          except:size=10**30
                          items.append((size,str(fid),name))
              uniq={fid:(sz,fid,n) for sz,fid,n in items}
              return sorted(uniq.values())
          def extract_download(resp, dest):
              # MCP ResourceLink / embedded resource / text containing JSON URL.
              urls=[]; blobs=[]
              def rec(v):
                  if isinstance(v,dict):
                      for k,z in v.items():
                          kl=str(k).lower()
                          if isinstance(z,str) and kl in ('uri','url','download_url','downloadurl','href') and z.startswith(('https://','http://')): urls.append(z)
                          if isinstance(z,str) and kl in ('blob','base64','data') and len(z)>1000: blobs.append(z)
                          rec(z)
                  elif isinstance(v,list):
                      for z in v:rec(z)
                  elif isinstance(v,str):
                      for u in re.findall(r'https://[^\s"<>]+',v): urls.append(u.rstrip(').,]'))
                      s=v.strip()
                      if s.startswith(('{','[')):
                          try:rec(json.loads(s))
                          except:pass
              rec(resp)
              for b in blobs:
                  try:
                      raw=base64.b64decode(b,validate=False)
                      if raw[:2]==b'PK': dest.write_bytes(raw); return 'embedded_resource'
                  except:pass
              for u in urls:
                  print('::add-mask::'+u)
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':'MILK-Mistral-Migration/1.0'})
                      with urllib.request.urlopen(req,timeout=300) as r:
                          data=r.read()
                      if data[:2]==b'PK': dest.write_bytes(data); return 'resource_link'
                  except Exception: continue
              return None
          comment('MISTRAL_REAL_TRANSFER_STARTED source=Box_Google_Takeout_2026-07-02 drive_writes=0')
          folders=call('search_folders_by_name',{'folder_name':'Google Takeout 2026-07-02','limit':50})
          folder_id=find_folder_id(folders)
          if not folder_id:
              folders=call('search_folders_by_name',{'folder_name':'Takeout','limit':50}); folder_id=find_folder_id(folders)
          if not folder_id: raise RuntimeError('Mistral Box could not resolve Takeout folder id')
          listing=call('list_folder_content_by_folder_id',{'folder_id':folder_id,'fields':['id','name','type','size','sha1'],'limit':1000})
          zips=zip_items(listing)
          if not zips: raise RuntimeError('Mistral Box Takeout folder has no ZIP metadata')
          size,fid,name=zips[0]
          comment(f'MISTRAL_TAKEOUT_SELECTED file={name} box_file_id={fid} reported_bytes={size if size<10**30 else "unknown"} total_zip_candidates={len(zips)}')
          content=call('get_file_content',{'file_id':fid})
          local=tmp/name
          mode=extract_download(content,local)
          if not mode or not local.exists():
              # Ask Box details in case a representation/download URL lives there.
              details=call('get_file_details',{'file_id':fid,'fields':['id','name','size','sha1','representations','shared_link']})
              mode=extract_download(details,local)
          if not mode or not local.exists():
              # Persist only structural output types, never content.
              kinds=[str(x.get('type') or '') for x in (content.get('content') or []) if isinstance(x,dict)] if isinstance(content,dict) else []
              comment('MISTRAL_TAKEOUT_DOWNLOAD_BLOCKED file='+name+' content_types='+','.join(kinds)+' reason=no_consumable_private_resource')
              raise RuntimeError('Box connector exposed file but no consumable binary resource')
          actual=local.stat().st_size; sha=hashlib.sha256(local.read_bytes()).hexdigest()
          comment(f'MISTRAL_TAKEOUT_BINARY_ACQUIRED file={name} bytes={actual} sha256={sha} mode={mode}')
          remote_dir='takeout-baseline-2026-07-02'; remote_name=urllib.parse.quote(name,safe='._-() ')
          base=['curl','--fail','--silent','--show-error','--ssl-reqd','--ftp-pasv','--connect-timeout','30','--max-time','3600','--user','migration@associacaomilk.pt:'+pwd]
          # Ensure destination subdir exists; ignore if already present.
          subprocess.run(base+['--quote','MKD '+remote_dir,'ftp://troi.ptservidor.net:21/'],check=False)
          url='ftp://troi.ptservidor.net:21/'+remote_dir+'/'+remote_name
          subprocess.run(base+['-T',str(local),url],check=True)
          back=tmp/('back-'+name)
          subprocess.run(base+[url,'-o',str(back)],check=True)
          back_sha=hashlib.sha256(back.read_bytes()).hexdigest(); back_size=back.stat().st_size
          if sha!=back_sha or actual!=back_size: raise RuntimeError('FTPS download-back verification mismatch')
          comment(f'MISTRAL_REAL_TRANSFER_VERIFIED file={name} bytes={actual} sha256={sha} remote={remote_dir}/{name} source_snapshot=2026-07-02 drive_writes=0')
          PY
