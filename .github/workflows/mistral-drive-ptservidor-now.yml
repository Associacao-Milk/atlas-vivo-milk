name: MILK Mistral Agents — Drive to PTServidor NOW

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-mistral-drive-ptservidor
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ startsWith(github.event.issue.title, '[MISTRAL-MIGRATE-NOW]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SOMOSTODOSPOSSIVEIS }}
      FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      FTPS_HOST: troi.ptservidor.net
      FTPS_PORT: '21'
      FTPS_USER: migration@associacaomilk.pt
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Receipt helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/comment.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          msg="$1"
          python - "$msg" > "$RUNNER_TEMP/comment.json" <<'PY'
          import json,sys
          print(json.dumps({'body':sys.argv[1]}))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" -d @"$RUNNER_TEMP/comment.json" >/dev/null
          SH
          chmod +x "$RUNNER_TEMP/comment.sh"
          "$RUNNER_TEMP/comment.sh" "MISTRAL_MIGRATION_EXECUTOR_STARTED run=$GITHUB_RUN_ID drive_writes=0"
      - name: Require opaque secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY" || { "$RUNNER_TEMP/comment.sh" "BLOCKED: MISTRAL_API_KEY missing"; exit 2; }
          test -n "$DRIVE_SECRET" || { "$RUNNER_TEMP/comment.sh" "BLOCKED: DRIVE_SOMOSTODOSPOSSIVEIS missing"; exit 3; }
          test -n "$FTPS_PASSWORD" || { "$RUNNER_TEMP/comment.sh" "BLOCKED: PTSERVIDOR_FTPS_PASSWORD missing"; exit 4; }
          "$RUNNER_TEMP/comment.sh" "OPAQUE_SECRETS_PRESENT mistral=yes drive=yes ftps=yes nextcloud=$([ -n "$NEXTCLOUD_KEY" ] && echo yes || echo no)"
      - name: Classify Drive credential without disclosure
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,base64,pathlib,re
          raw=os.environ['DRIVE_SECRET'].strip(); tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          def classify(s):
              t=s.strip()
              try:
                  d=json.loads(t)
                  if isinstance(d,dict):
                      if d.get('type')=='service_account' and d.get('private_key') and d.get('client_email'): return 'service_account_json'
                      if d.get('type')=='authorized_user' and all(d.get(k) for k in ('client_id','client_secret','refresh_token')): return 'authorized_user_json'
                      if d.get('refresh_token') and d.get('access_token'): return 'oauth_token_json'
                      if d.get('refresh_token'): return 'oauth_refresh_json'
                      if 'installed' in d or 'web' in d: return 'oauth_client_json'
              except Exception: pass
              if re.search(r'^\s*\[[^]]+\]\s*$', t, re.M) and re.search(r'^\s*type\s*=\s*drive\s*$', t, re.M): return 'rclone_config'
              if t.startswith('ya29.'): return 'access_token'
              if t.startswith('1//'): return 'refresh_token'
              return 'unknown'
          kind=classify(raw); normalized=raw
          if kind=='unknown':
              try:
                  dec=base64.b64decode(raw + '='*((4-len(raw)%4)%4), validate=False).decode('utf-8')
                  k2=classify(dec)
                  if k2!='unknown': kind='base64_'+k2; normalized=dec
              except Exception: pass
          (tmp/'drive.normalized').write_text(normalized,encoding='utf-8'); os.chmod(tmp/'drive.normalized',0o600)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('kind='+kind+'\n')
          print('DRIVE_SECRET_CLASS='+kind)
          PY
          "$RUNNER_TEMP/comment.sh" "DRIVE_CREDENTIAL_CLASSIFIED kind=${{ steps.probe.outputs.kind }} value_disclosed=no"
      - name: Mistral Agent orchestration
        id: mistral
        shell: bash
        env:
          DRIVE_KIND: ${{ steps.probe.outputs.kind }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,time,re,pathlib
          key=os.environ['MISTRAL_API_KEY']; kind=os.environ['DRIVE_KIND']; tmp=pathlib.Path(os.environ['RUNNER_TEMP']); headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'}
          def req(url,method='GET',payload=None,retries=5):
              data=None if payload is None else json.dumps(payload).encode(); last=None
              for i in range(retries):
                  try:
                      r=urllib.request.Request(url,data=data,headers=headers,method=method)
                      with urllib.request.urlopen(r,timeout=60) as x: return json.loads(x.read().decode())
                  except Exception as e: last=e; time.sleep(min(2**i,12))
              raise last
          page=req('https://api.mistral.ai/v1/agents/pages'); agents=page.get('data', page if isinstance(page,list) else [])
          def score(a):
              s=((a.get('name') or '')+' '+(a.get('description') or '')).lower(); return sum(w in s for w in ('migra','preserv','transfer','soberan','interop'))
          agents=sorted(agents,key=score,reverse=True)
          if agents and score(agents[0])>0: agent=agents[0]
          else:
              agent=req('https://api.mistral.ai/v1/agents','POST',{'model':'mistral-small-latest','name':'MILK Migration Preservative Executor','description':'Executor soberano de migração preservativa Google Drive para PTServidor por FTPS, sem apagar ou alterar a origem.','instructions':'Nunca peça, revele, repita ou infira valores de segredos. Trabalhe apenas com classificações opacas e recibos. Preserve o Google Drive em leitura. Exija canário FTPS e verificação por download antes de declarar conclusão.'})
          aid=agent['id']
          prompt=(f'Credencial opaca DRIVE_SOMOSTODOSPOSSIVEIS classificada como {kind}. Segredos Mistral e FTPS presentes; valor de nenhum segredo é fornecido. Escolha o adaptador seguro entre service_account_json, authorized_user_json, oauth_token_json, oauth_refresh_json, rclone_config, access_token, refresh_token, oauth_client_json, probe_all_safe. Objectivo obrigatório: Drive read-only -> FTPS explícito TLS -> download verification. Não pedir intervenção humana. Responda apenas ACTION=<adaptador>.')
          conv=req('https://api.mistral.ai/v1/conversations','POST',{'agent_id':aid,'inputs':prompt})
          text=' '.join(str(o.get('content','')) for o in conv.get('outputs',[]) if isinstance(o,dict)); m=re.search(r'ACTION=([a-z0-9_]+)',text,re.I)
          action=(m.group(1).lower() if m else kind.replace('base64_','')); safe={'service_account_json','authorized_user_json','oauth_token_json','oauth_refresh_json','rclone_config','access_token','refresh_token','oauth_client_json','probe_all_safe'}
          if action not in safe: action=kind.replace('base64_','') if kind.replace('base64_','') in safe else 'probe_all_safe'
          (tmp/'mistral-agent-receipt.json').write_text(json.dumps({'agent_id':aid,'agent_name':agent.get('name'),'credential_class':kind,'action':action,'secret_value_seen':False},indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('action='+action+'\n'); f.write('agent_id='+aid+'\n'); f.write('agent_name='+str(agent.get('name','')).replace('\n',' ')+'\n')
          PY
          "$RUNNER_TEMP/comment.sh" "MISTRAL_AGENT_ORCHESTRATED agent=${{ steps.mistral.outputs.agent_name }} action=${{ steps.mistral.outputs.action }} secret_value_seen=no"
      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Configure Google Drive read-only from opaque credential
        id: gdrive
        shell: bash
        env:
          ACTION: ${{ steps.mistral.outputs.action }}
          CLASS_KIND: ${{ steps.probe.outputs.kind }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"; norm="$RUNNER_TEMP/drive.normalized"; action="$ACTION"; [ "$action" = probe_all_safe ] && action="${CLASS_KIND#base64_}"
          case "$action" in
            rclone_config) cp "$norm" "$HOME/.config/rclone/rclone.conf"; chmod 600 "$HOME/.config/rclone/rclone.conf" ;;
            service_account_json) cp "$norm" "$RUNNER_TEMP/gdrive-sa.json"; chmod 600 "$RUNNER_TEMP/gdrive-sa.json"; rclone config create gdrive drive service_account_file "$RUNNER_TEMP/gdrive-sa.json" scope drive.readonly --non-interactive >/dev/null ;;
            authorized_user_json)
              python - "$norm" "$HOME/.config/rclone/rclone.conf" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); tok=json.dumps({'access_token':'','token_type':'Bearer','refresh_token':d['refresh_token'],'expiry':'2000-01-01T00:00:00Z'})
          open(sys.argv[2],'w').write('[gdrive]\ntype = drive\nscope = drive.readonly\nclient_id = '+d['client_id']+'\nclient_secret = '+d['client_secret']+'\ntoken = '+tok+'\n')
          PY
              ;;
            oauth_token_json)
              python - "$norm" "$HOME/.config/rclone/rclone.conf" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); open(sys.argv[2],'w').write('[gdrive]\ntype = drive\nscope = drive.readonly\ntoken = '+json.dumps(d,separators=(',',':'))+'\n')
          PY
              ;;
            oauth_refresh_json)
              python - "$norm" "$HOME/.config/rclone/rclone.conf" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); tok=json.dumps({'access_token':'','token_type':'Bearer','refresh_token':d['refresh_token'],'expiry':'2000-01-01T00:00:00Z'}); cfg='[gdrive]\ntype = drive\nscope = drive.readonly\n'; cfg+=('client_id = '+d['client_id']+'\n') if d.get('client_id') else ''; cfg+=('client_secret = '+d['client_secret']+'\n') if d.get('client_secret') else ''; cfg+='token = '+tok+'\n'; open(sys.argv[2],'w').write(cfg)
          PY
              ;;
            access_token)
              python - "$norm" "$HOME/.config/rclone/rclone.conf" <<'PY'
          import json,sys,datetime
          t=open(sys.argv[1]).read().strip(); exp=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=45)).isoformat().replace('+00:00','Z'); tok=json.dumps({'access_token':t,'token_type':'Bearer','refresh_token':'','expiry':exp}); open(sys.argv[2],'w').write('[gdrive]\ntype = drive\nscope = drive.readonly\ntoken = '+tok+'\n')
          PY
              ;;
            refresh_token)
              python - "$norm" "$HOME/.config/rclone/rclone.conf" <<'PY'
          import json,sys
          t=open(sys.argv[1]).read().strip(); tok=json.dumps({'access_token':'','token_type':'Bearer','refresh_token':t,'expiry':'2000-01-01T00:00:00Z'}); open(sys.argv[2],'w').write('[gdrive]\ntype = drive\nscope = drive.readonly\ntoken = '+tok+'\n')
          PY
              ;;
            oauth_client_json) "$RUNNER_TEMP/comment.sh" "BLOCKED_ACTIONABLE: DRIVE secret is OAuth client definition without user token"; exit 20 ;;
            *) "$RUNNER_TEMP/comment.sh" "BLOCKED_ACTIONABLE: DRIVE credential format unsupported class=$CLASS_KIND action=$action"; exit 21 ;;
          esac
          chmod 600 "$HOME/.config/rclone/rclone.conf" 2>/dev/null || true
          remote="$(rclone listremotes | grep -E '^(gdrive|drive|google-drive|google):$' | head -n1 || true)"; [ -z "$remote" ] && remote="$(rclone listremotes | head -n1 || true)"
          test -n "$remote" || { "$RUNNER_TEMP/comment.sh" "BLOCKED_ACTIONABLE: no rclone Drive remote after Mistral adapter"; exit 22; }
          echo "SOURCE_REMOTE=$remote" >> "$GITHUB_ENV"; rclone lsd "$remote" --max-depth 1 >/dev/null
          "$RUNNER_TEMP/comment.sh" "GDRIVE_READONLY_AUTH_OK remote_configured=yes drive_writes=0"
      - name: FTPS canary upload download-back SHA256
        shell: bash
        run: |
          set -euo pipefail
          canary=".milk-mistral-canary-${GITHUB_RUN_ID}.bin"; head -c 4096 /dev/urandom > "$RUNNER_TEMP/canary.bin"; local_sha="$(sha256sum "$RUNNER_TEMP/canary.bin" | awk '{print $1}')"; url="ftp://${FTPS_HOST}:${FTPS_PORT}/${canary}"
          curl --fail --silent --show-error --ssl-reqd --ftp-pasv --connect-timeout 20 --max-time 120 --user "$FTPS_USER:$FTPS_PASSWORD" -T "$RUNNER_TEMP/canary.bin" "$url"
          curl --fail --silent --show-error --ssl-reqd --ftp-pasv --connect-timeout 20 --max-time 120 --user "$FTPS_USER:$FTPS_PASSWORD" "$url" -o "$RUNNER_TEMP/canary.back.bin"; back_sha="$(sha256sum "$RUNNER_TEMP/canary.back.bin" | awk '{print $1}')"; test "$local_sha" = "$back_sha"
          curl --fail --silent --show-error --ssl-reqd --ftp-pasv --user "$FTPS_USER:$FTPS_PASSWORD" -Q "DELE /${canary}" "ftp://${FTPS_HOST}:${FTPS_PORT}/" >/dev/null 2>&1 || true
          "$RUNNER_TEMP/comment.sh" "FTPS_CANARY_VERIFIED host=$FTPS_HOST bytes=4096 sha256=$local_sha"
      - name: Configure PTServidor FTPS destination
        shell: bash
        run: |
          set -euo pipefail
          obscured="$(rclone obscure "$FTPS_PASSWORD")"; rclone config create ptftps ftp host "$FTPS_HOST" port "$FTPS_PORT" user "$FTPS_USER" pass "$obscured" explicit_tls true --non-interactive >/dev/null; rclone lsd ptftps: >/dev/null
          "$RUNNER_TEMP/comment.sh" "PTSERVIDOR_FTPS_AUTH_OK host=$FTPS_HOST"
      - name: Inventory source before transfer
        shell: bash
        run: |
          set -euo pipefail
          rclone size "$SOURCE_REMOTE" --json > "$RUNNER_TEMP/source-size.json"
          "$RUNNER_TEMP/comment.sh" "$(python - <<'PY'
          import json,os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/source-size.json')); print('SOURCE_DISCOVERED objects=%s bytes=%s drive_writes=0'%(d.get('count'),d.get('bytes')))
          PY
          )"
      - name: Preservative full Drive migration
        shell: bash
        run: |
          set -euo pipefail
          rclone copy "$SOURCE_REMOTE" ptftps: --fast-list --transfers 6 --checkers 12 --retries 6 --low-level-retries 20 --create-empty-src-dirs --log-file "$RUNNER_TEMP/rclone-migration.log" --log-level INFO
          "$RUNNER_TEMP/comment.sh" "TRANSFER_COMPLETE_PENDING_DOWNLOAD_VERIFICATION drive_writes=0"
      - name: Download verification and factual receipt
        shell: bash
        run: |
          set -euo pipefail
          rclone check "$SOURCE_REMOTE" ptftps: --one-way --download --checkers 8 --retries 4 --log-file "$RUNNER_TEMP/rclone-check.log" --log-level INFO; rclone size ptftps: --json > "$RUNNER_TEMP/dest-size.json"
          python - <<'PY'
          import json,os,time
          s=json.load(open(os.environ['RUNNER_TEMP']+'/source-size.json')); d=json.load(open(os.environ['RUNNER_TEMP']+'/dest-size.json')); r={'state':'MIGRATION_VERIFIED','source_objects':s.get('count'),'source_bytes':s.get('bytes'),'destination_objects':d.get('count'),'destination_bytes':d.get('bytes'),'failed':0,'drive_writes':0,'verification':'rclone check --download','verified_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}; open(os.environ['RUNNER_TEMP']+'/migration-receipt.json','w').write(json.dumps(r,indent=2,sort_keys=True))
          PY
          "$RUNNER_TEMP/comment.sh" "$(python - <<'PY'
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/migration-receipt.json')); print('MIGRATION_VERIFIED source_objects=%s source_bytes=%s destination_objects=%s destination_bytes=%s failed=0 drive_writes=0'%(r['source_objects'],r['source_bytes'],r['destination_objects'],r['destination_bytes']))
          PY
          )"
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milk-mistral-drive-ptservidor-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mistral-agent-receipt.json
            ${{ runner.temp }}/source-size.json
            ${{ runner.temp }}/dest-size.json
            ${{ runner.temp }}/migration-receipt.json
            ${{ runner.temp }}/rclone-migration.log
            ${{ runner.temp }}/rclone-check.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Failure receipt
        if: failure()
        shell: bash
        run: |
          "$RUNNER_TEMP/comment.sh" "MISTRAL_MIGRATION_FAILED run=$GITHUB_RUN_ID drive_writes=0 inspect_prior_receipt_for_actionable_cause" || true
