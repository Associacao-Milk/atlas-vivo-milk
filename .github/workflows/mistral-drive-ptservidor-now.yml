name: MILK Mistral Agents — Drive to PTServidor NOW

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mistral-drive-ptservidor-now.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-mistral-drive-ptservidor
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[MISTRAL-MIGRATE-NOW]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DRIVE_SOMOSTODOSPOSSIVEIS: ${{ secrets.DRIVE_SOMOSTODOSPOSSIVEIS }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON || secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.GDRIVE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.GDRIVE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN || secrets.GDRIVE_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '35'
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        shell: bash
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Select strongest existing Drive credential without disclosure
        id: select
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python scripts/select_drive_credential.py)"
          test -n "$selected" || { echo 'No Drive credential candidate exists'; exit 12; }
          echo "::add-mask::$selected"
          printf '%s' "$selected" > "$RUNNER_TEMP/drive-selected"
          chmod 600 "$RUNNER_TEMP/drive-selected"
      - name: Zero-disclosure selected credential shape probe
        shell: bash
        run: |
          export DRIVE_SOMOSTODOSPOSSIVEIS="$(cat "$RUNNER_TEMP/drive-selected")"
          python scripts/probe_drive_secret_shape.py
      - name: Execute Mistral migration runtime
        shell: bash
        run: |
          set -euo pipefail
          export DRIVE_SOMOSTODOSPOSSIVEIS="$(cat "$RUNNER_TEMP/drive-selected")"
          normalized="$(python scripts/normalize_drive_secret.py)"
          echo "::add-mask::$normalized"
          export DRIVE_SOMOSTODOSPOSSIVEIS="$normalized"
          echo "MISTRAL_DRIVE_CREDENTIAL_SOURCE=${{ steps.select.outputs.source }}"
          python scripts/mistral_drive_ptservidor_now.py
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milk-mistral-drive-ptservidor-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mistral-agent-receipt.json
            ${{ runner.temp }}/source-size.json
            ${{ runner.temp }}/dest-size.json
            ${{ runner.temp }}/migration-receipt.json
            ${{ runner.temp }}/rclone-migration.log
            ${{ runner.temp }}/rclone-check.log
          if-no-files-found: ignore
          retention-days: 30

# all-existing-drive-secrets-rerun: 2026-08-20T21:48+01:00
