name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Validate Metadata & Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install AJV CLI
        run: npm install -g ajv-cli
      - name: Validate metadata.json against schema
        run: ajv validate -s .github/schemas/metadata-schema.json -d metadata.json --spec=draft7 --strict=false
      - name: Check JSON syntax
        run: |
          jq empty metadata.json
          for file in $(find . -type f -name "*.json" ! -path "./.git/*" ! -path "./.github/*"); do
            jq empty "$file" || { echo "Invalid JSON: $file"; exit 1; }
          done
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML files
        run: |
          for file in $(find . -type f -name "*.html" ! -path "./.git/*"); do
            grep -qi "<!doctype html>" "$file" || { echo "Missing DOCTYPE in $file"; exit 1; }
          done
      - name: Check changed JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          else
            git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME}"
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD -- '*.js')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JavaScript files"
            exit 0
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
  test-backend:
    name: Test Backend (Apps Script)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Check Apps Script files
        run: |
          for file in $(find . -type f -name "*.gs" ! -path "./.git/*"); do
            node --check "$file" 2>&1 || { echo "Syntax error in $file"; exit 1; }
          done
  lint:
    name: Lint Markdown & YAML
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Lint changed Markdown files
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          else
            git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME}"
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD -- '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Markdown files"
            exit 0
          fi
          npx --yes markdownlint-cli@0.44.0 -c .github/markdownlint-config.json "${files[@]}"
      - name: Validate changed YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          else
            git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME}"
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$base"...HEAD -- '*.yml' '*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed YAML files"
            exit 0
          fi
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "valid: #{file}" }' "${files[@]}"
