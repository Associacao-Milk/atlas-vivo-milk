name: MILK Mistral Saneamento Pipeline

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: 'Diretório do lote saneado/decodificado a processar'
        required: true
        default: 'migration-inbox/current'
  push:
    branches: [master]
    paths:
      - 'migration-inbox/**'
      - '.github/workflows/mistral-saneamento-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: milk-saneamento-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rewrite_c1:
    name: Agente 1 — Hermenêutica C1
    runs-on: ubuntu-latest
    outputs:
      batch: ${{ steps.resolve.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          batch='${{ github.event.inputs.batch_path }}'
          if [ -z "$batch" ]; then batch='migration-inbox/current'; fi
          test -d "$batch" || { echo "::error::Lote inexistente: $batch"; exit 2; }
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
      - name: Validate source/provenance contract
        shell: bash
        run: |
          set -euo pipefail
          batch='${{ steps.resolve.outputs.batch }}'
          test -f "$batch/manifest.json"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('${{ steps.resolve.outputs.batch }}')/'manifest.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          for k in ['batch_id','objects']:
              if k not in d: raise SystemExit('manifest missing: '+k)
          for o in d['objects']:
              for k in ['atlas_id','source_id','source_revision','source_hash','origin','tags']:
                  if k not in o: raise SystemExit(f"object missing {k}: {o.get('atlas_id','?')}")
          PY
      - name: Require Mistral runtime
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY" || { echo '::error::MISTRAL_API_KEY missing'; exit 2; }
      - name: Mark C1 contract
        run: |
          set -euo pipefail
          batch='${{ steps.resolve.outputs.batch }}'
          printf '%s\n' \
            'HERMENEUTICA_C1=required' \
            'PT_PT=required' \
            'APA7=when_applicable' \
            'AUTHORIAL_VOICE=preserve' \
            'NON_EU_AI_TRACES=remove_only_when_proven' > "$batch/.stage-c1"
      - uses: actions/upload-artifact@v4
        with:
          name: c1-${{ github.run_id }}
          path: ${{ steps.resolve.outputs.batch }}
          retention-days: 7

  decode_skill_memory:
    name: Agente 2 — Decodificar código/skill + memória IA MILK
    needs: rewrite_c1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c1-${{ github.run_id }}
          path: batch
      - name: Validate infrastructure + memory contract
        run: |
          set -euo pipefail
          test -f batch/manifest.json
          printf '%s\n' \
            'SKILL_OUTPUT=required' \
            'INFRASTRUCTURE_OUTPUT=required' \
            'MEMORY_RELATIONAL_OUTPUT=required' \
            'PUBLIC_INVISIBLE_BOUNDARY=hard' \
            'HUMAN_GATE=required' > batch/.stage-decode
          find batch -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 sha256sum > batch/checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-${{ github.run_id }}
          path: batch
          retention-days: 7

  handoff_gitlab:
    name: Agente 3 — Inserir no GitLab para correcção
    needs: decode_skill_memory
    runs-on: ubuntu-latest
    env:
      GITLAB_REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decoded-${{ github.run_id }}
          path: batch
      - name: Enforce GitLab-before-PTServidor rule
        run: |
          set -euo pipefail
          test -n "$GITLAB_REPO_URL" || { echo '::error::GITLAB_REPO_URL missing'; exit 2; }
          test -n "$GITLAB_TOKEN" || { echo '::error::GITLAB_TOKEN missing'; exit 2; }
          batch_id=$(python -c "import json; print(json.load(open('batch/manifest.json'))['batch_id'])")
          printf '%s\n' \
            "batch_id=$batch_id" \
            "source_github_sha=$GITHUB_SHA" \
            'required_next_stage=GITLAB_CORRECTION_AND_TESTS' \
            'ptservidor_allowed=false' > batch/GITLAB_HANDOFF.txt
      - name: Push isolated correction branch to GitLab
        shell: bash
        run: |
          set -euo pipefail
          batch_id=$(python -c "import json; print(json.load(open('batch/manifest.json'))['batch_id'])")
          work=$(mktemp -d)
          cp -a batch/. "$work/"
          cd "$work"
          git init -q
          git config user.name 'Associação MILK - Atlas Pipeline'
          git config user.email 'milk@associacaomilk.pt'
          git add .
          git commit -qm "MILK batch $batch_id — awaiting GitLab correction"
          auth_url=$(python - <<'PY'
          import os, urllib.parse
          u=os.environ['GITLAB_REPO_URL']
          t=urllib.parse.quote(os.environ['GITLAB_TOKEN'], safe='')
          if not u.startswith('https://'): raise SystemExit('GITLAB_REPO_URL must use https')
          print('https://oauth2:'+t+'@'+u[len('https://'):])
          PY
          )
          git remote add gitlab "$auth_url"
          git push --force gitlab HEAD:"refs/heads/milk-correction/$batch_id"
          echo "GITLAB_BRANCH=milk-correction/$batch_id"
      - name: Stop before PTServidor
        run: |
          echo 'GitLab handoff complete. PTServidor is intentionally blocked until a corrected GitLab artifact and successful GitLab tests are verified.'

# HARD GATE: there is deliberately no PTServidor deployment job in this workflow.
# Correct order: Drive -> Mistral C1 -> Mistral decode -> GitLab correction/tests -> verified corrected artifact -> PTServidor.
