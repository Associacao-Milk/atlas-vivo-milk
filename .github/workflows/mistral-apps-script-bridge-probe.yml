name: MILK Mistral — Existing Google Export Bridge Probe

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mistral-apps-script-bridge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '35'
    steps:
      - uses: actions/checkout@v4
      - name: Mistral agent probes existing Google export Web App read-only
        run: python scripts/mistral_apps_script_bridge_probe.py
